<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktiekompassen</title>
<meta name="description" content="Din egen aktieportfölj med nyckeltal, köp- och säljregler och en kompass som visar beslutsläget per aktie.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D28" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aktiekompassen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: en kolumn (max 760px), sticky huvud med varumärke + tre flikar, kort för innehav,
   formulär som bottenark på mobil och centrerad dialog på dator. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E8ECF2;
  --fg: #141A24;
  --muted: #5C6778;
  --line: #D6DCE6;
  --accent: #1F4FD8;
  --accent-fg: #FFFFFF;
  --accent-soft: #E3EAFB;
  --buy: #15803D;  --buy-bg: #DCF5E6;
  --sell: #C0243A; --sell-bg: #FCE4E8;
  --watch: #B45309; --watch-bg: #FDEBD2;
  --hold: #5C6778; --hold-bg: #E8ECF2;
  --backdrop: rgba(10, 14, 22, .5);
  --shadow: 0 1px 2px rgba(20,26,36,.06), 0 6px 20px rgba(20,26,36,.08);
  --font-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --surface-2: #1F2834; --fg: #E7ECF3; --muted: #97A2B3; --line: #2A3442;
    --accent: #86A4FF; --accent-fg: #0E131B; --accent-soft: #1C2A4D;
    --buy: #4ADE80; --buy-bg: #11301F; --sell: #FB7185; --sell-bg: #3B1621; --watch: #FBBF24; --watch-bg: #3A2B0C;
    --hold: #97A2B3; --hold-bg: #1F2834; --backdrop: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1F2834; --fg: #E7ECF3; --muted: #97A2B3; --line: #2A3442;
  --accent: #86A4FF; --accent-fg: #0E131B; --accent-soft: #1C2A4D;
  --buy: #4ADE80; --buy-bg: #11301F; --sell: #FB7185; --sell-bg: #3B1621; --watch: #FBBF24; --watch-bg: #3A2B0C;
  --hold: #97A2B3; --hold-bg: #1F2834; --backdrop: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pos { color: var(--buy); }
.neg { color: var(--sell); }
.r { text-align: right; }
.center { text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Huvud */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; font-size: 17px; padding-block: 12px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.brand .status-line { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { position: relative; padding: 15px 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; line-height: 18px; text-align: center; font-family: var(--font-num); margin-left: 4px; vertical-align: 1px; }
.badge:empty { display: none; }
@media (max-width: 520px) {
  .brand { padding-block: 10px 0; }
  .tabs { width: 100%; margin-left: 0; }
  .tab { flex: 1; text-align: center; padding: 8px 2px 10px; font-size: 13.5px; }
}
.facit .tx { font-size: 12.5px; }
.facit .tx td, .facit .tx th { white-space: nowrap; padding-left: 6px; }
.facit .tx td:first-child, .facit .tx th:first-child { padding-left: 0; }
.facit .tx td.w { min-width: 7ch; }
.facit .tx .chip.sm { font-size: 9.5px; padding: 1px 5px; }

/* Sida */
.wrap { max-width: 760px; margin: 0 auto; padding-block: 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.block { display: grid; gap: 10px; min-width: 0; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.list-head h2, .card h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); }
.lead { font-size: 13.5px; color: var(--muted); max-width: 60ch; }
.notice { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.notice.warn { background: var(--watch-bg); }
.notice.err { background: var(--sell-bg); }

/* Knappar */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 14px; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--sell); border-color: var(--sell); background: transparent; }
.btn.link { border: none; background: none; color: var(--accent); padding: 0; }
.btn.icon { padding: 6px 9px; font-size: 13px; }
.btn.sm { padding: 5px 9px; font-size: 13px; }

/* Sammanfattning */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.summary.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 600px) { .summary { grid-template-columns: 1fr 1fr; } .summary.three .tile { padding: 10px 12px; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile-value { font-size: 21px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.tile-sub { font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 8px; vertical-align: 1px; }
.dot:first-child { margin-left: 0; }
.dot.kop { background: var(--buy); } .dot.salj { background: var(--sell); } .dot.watch { background: var(--watch); }

/* Kort */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Aktiekort */
.stocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.stock-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.stock-card:hover { border-color: var(--accent); }
.sc-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.sc-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticker { font-weight: 800; letter-spacing: -0.01em; }
.name { color: var(--muted); font-size: 13px; }
.sc-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.sc-row .val { font-weight: 500; }
.sc-verdict { display: grid; justify-items: center; gap: 2px; width: 76px; flex: none; }
.sc-verdict svg { width: 66px; height: auto; }

/* Chips */
.chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--hold-bg); color: var(--hold); white-space: nowrap; line-height: 1.5; }
.chip.kop { background: var(--buy-bg); color: var(--buy); }
.chip.salj { background: var(--sell-bg); color: var(--sell); }
.chip.bevaka { background: var(--watch-bg); color: var(--watch); }
.chip.behall, .chip.saknas { background: var(--hold-bg); color: var(--hold); }
.chip.exempel { background: var(--accent-soft); color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.lista { background: var(--surface-2); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.stale, .chip.fel { background: var(--watch-bg); color: var(--watch); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.fel { background: var(--sell-bg); color: var(--sell); }
.chip.sm { font-size: 10px; padding: 1px 6px; }

/* Kompass */
.gauge .z { fill: none; stroke-width: 9; }
.gauge .z-salj { stroke: var(--sell); }
.gauge .z-behall { stroke: var(--surface-2); }
.gauge .z-kop { stroke: var(--buy); }
.gauge .needle { stroke: var(--fg); stroke-width: 2.6; stroke-linecap: round; }
.gauge .pivot { fill: var(--fg); }
.gauge.none .needle, .gauge.none .pivot { opacity: .3; }

/* Detalj */
.detail { display: grid; gap: 14px; }
.back { justify-self: start; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.d-ticker { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.d-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.d-price { grid-template-columns: 1fr 1.3fr; align-items: start; gap: 16px; }
@media (max-width: 560px) { .d-price { grid-template-columns: 1fr; } }
.price-main { display: grid; gap: 4px; }
.price-input { display: flex; align-items: baseline; gap: 6px; }
.price-input input { font-size: 26px; font-weight: 500; padding: 4px 8px; width: 100%; max-width: 190px; }
.price-big { font-size: 26px; font-weight: 500; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0; }
.facts > div { display: grid; gap: 1px; min-width: 0; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; font-family: var(--font-ui); }
.facts dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.d-verdict { grid-template-columns: 190px 1fr; align-items: center; gap: 16px; }
@media (max-width: 560px) { .d-verdict { grid-template-columns: 1fr; } }
.gauge-wrap { display: grid; justify-items: center; gap: 2px; }
.gauge-wrap svg { width: 170px; max-width: 100%; height: auto; }
.verdict-label { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
.verdict-label.kop { color: var(--buy); } .verdict-label.salj { color: var(--sell); } .verdict-label.bevaka { color: var(--watch); } .verdict-label.behall, .verdict-label.saknas { color: var(--muted); }
.score { font-size: 13px; color: var(--muted); }
.verdict-text { display: grid; gap: 8px; min-width: 0; }
.rule-check { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.rule-check li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rule-check .mark { width: 16px; flex: none; font-weight: 800; text-align: center; }
.rule-check .ok.kop .mark { color: var(--buy); }
.rule-check .ok.salj .mark { color: var(--sell); }
.rule-check .no .mark, .rule-check .na { color: var(--muted); }
.rule-check .rc-text { flex: 1; min-width: 12ch; }
.rc-meta { display: inline-flex; gap: 6px; align-items: center; }
.weight { font-family: var(--font-num); font-size: 10px; letter-spacing: 2px; color: var(--muted); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; background: none; line-height: 1.5; }
button.tag { cursor: pointer; }
.tag.auto { color: var(--accent); border-color: var(--accent); }
.tag.lock { color: var(--watch); border-color: var(--watch); }

.metrics { width: 100%; border-collapse: collapse; }
.metrics th { text-align: left; font-weight: 500; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.metrics td { padding: 6px 0 6px 8px; border-top: 1px solid var(--line); }
.metrics tr.grp th { border-top: none; padding: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.metrics tr.grp:first-child th { padding-top: 0; }
.metrics tr.grp + tr th, .metrics tr.grp + tr td { border-top: none; }
.metrics td.val { width: 120px; text-align: right; }
.metrics td.unit { width: 34px; color: var(--muted); font-size: 13px; }
.metrics input { padding: 6px 8px; }
.metrics .desc { font-size: 11.5px; color: var(--muted); font-weight: 400; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rule { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex-wrap: wrap; }
.rule.off { opacity: .55; }
.rule-body { flex: 1; min-width: 14ch; }
.rule-title { font-weight: 600; }
.rule-sub { font-size: 12px; color: var(--muted); }
.rule-meta { display: inline-flex; align-items: center; gap: 8px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; display: block; cursor: pointer; }

.tx { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tx th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 4px 0; }
.tx td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tx th.r, .tx td.r { text-align: right; padding-left: 8px; }
.table-scroll { overflow-x: auto; }

textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 72px; resize: vertical; }
input[type="text"], input:not([type]), input[type="search"], input[type="date"], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input.num { font-family: var(--font-num); text-align: right; }
input::placeholder { color: var(--muted); opacity: .8; }
.danger-zone { display: flex; justify-content: flex-end; }

/* Signaler */
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.signal { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
.signal:hover { border-color: var(--accent); }
.signal > .chip { min-width: 56px; text-align: center; }
.signal.kop { border-left-color: var(--buy); }
.signal.salj { border-left-color: var(--sell); }
.sig-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.sig-title { font-weight: 600; }
.sig-text { font-size: 13px; color: var(--muted); }
.verdict-row { display: flex; gap: 8px; flex-wrap: wrap; }
.verdict-row .btn { display: inline-flex; gap: 8px; align-items: center; }

.metrics-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.metrics-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.metrics-list li:first-child { border-top: none; }
.metrics-list .m-name { flex: 1; min-width: 14ch; }
.metrics-list .m-unit { color: var(--muted); font-size: 13px; width: 34px; }
.thresholds { display: grid; gap: 10px; }
.thresholds label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.thresholds input { width: 72px; }
.status { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.status .dot { margin: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tomt / laddar */
.empty { text-align: center; padding: 36px 16px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 56px; height: 56px; color: var(--accent); }
.empty p { max-width: 46ch; color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; display: inline-block; vertical-align: -4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* Dialog */
dialog { border: none; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 0; }
.sheet-head h2 { font-size: 17px; font-weight: 700; }
.sheet-body { padding: 12px 16px 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg label { flex: 1; text-align: center; padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; width: 0; height: 0; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-fg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.form-error { color: var(--sell); font-size: 13px; font-weight: 600; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
.export-area { width: 100%; min-height: 160px; font-family: var(--font-num); font-size: 12px; }
.sok-res { display: grid; gap: 6px; min-height: 48px; }
.sok-hit { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 10px; }
.sok-hit .sh-sym { font-weight: 800; min-width: 9ch; }
.sok-hit .sh-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-weight: 500; }
.sok-hit .sh-bors { font-size: 12px; color: var(--muted); }
@media (max-width: 600px) {
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 92vh; }
  .sheet-head, .sheet-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sheet-body { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}

/* Analysmodellen */
.gauge .z-minska { stroke: var(--watch); opacity: .6; }
.dims { display: inline-flex; gap: 3px; align-items: flex-end; height: 24px; }
.dims i { display: block; width: 8px; height: var(--h); border-radius: 2px; background: var(--hold); opacity: .9; }
.dims i.hi { background: var(--buy); } .dims i.lo { background: var(--sell); } .dims i.mid { background: var(--watch); }
.dims i.na { background: none; border: 1px dashed var(--line); opacity: 1; }
.dims.sm { height: 18px; } .dims.sm i { width: 6px; }
.score-pill { font-size: 13px; font-weight: 500; color: var(--muted); }
.sc-verdict { width: 84px; }
.sc-skal { line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile-unit { font-size: 12px; color: var(--muted); margin-left: 2px; }
.d-verdict { grid-template-columns: 190px 1fr; grid-template-areas: "gauge text" "dims dims" "regler regler" "hint hint"; }
.d-verdict .gauge-wrap { grid-area: gauge; } .d-verdict .verdict-text { grid-area: text; } .d-verdict .dims-wrap { grid-area: dims; } .d-verdict .regler-wrap { grid-area: regler; } .d-verdict > .hint { grid-area: hint; }
@media (max-width: 560px) { .d-verdict { grid-template-columns: 1fr; grid-template-areas: "gauge" "text" "dims" "regler" "hint"; } }
.skal { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .skal { grid-template-columns: 1fr; } }
.skal h3, .flaggor h3, .regler-wrap h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.skal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.skal-list li { display: flex; gap: 8px; align-items: baseline; }
.skal-list .mark { width: 16px; flex: none; font-weight: 800; text-align: center; font-family: var(--font-num); }
.skal-list .for .mark { color: var(--buy); } .skal-list .emot .mark { color: var(--sell); }
.skal-list .sub { display: block; font-size: 11.5px; color: var(--muted); }
.flaggor { background: var(--sell-bg); border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
.flaggor h3 { color: var(--sell); }
.flaggor ul { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
.dims-wrap { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.dim summary { display: grid; grid-template-columns: 1fr 120px 36px; grid-template-areas: "name bar p" "sub sub sub"; align-items: center; gap: 2px 10px; cursor: pointer; padding: 6px 0; list-style: none; }
.dim summary::-webkit-details-marker { display: none; }
.dim .dim-name { grid-area: name; font-weight: 600; font-size: 14px; }
.dim .dim-bar { grid-area: bar; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dim .dim-bar i { display: block; height: 100%; width: var(--w); background: var(--hold); border-radius: 4px; }
.dim.hi .dim-bar i { background: var(--buy); } .dim.lo .dim-bar i { background: var(--sell); } .dim.mid .dim-bar i { background: var(--watch); }
.dim .dim-p { grid-area: p; text-align: right; font-size: 14px; }
.dim .dim-sub { grid-area: sub; font-size: 11.5px; color: var(--muted); }
.dim.off { opacity: .55; }
.dim[open] summary .dim-name::after { content: " ▾"; color: var(--muted); }
.dim:not([open]) summary .dim-name::after { content: " ▸"; color: var(--muted); }
.krit-list { list-style: none; margin: 0 0 8px; padding: 0 0 0 4px; display: grid; gap: 6px; font-size: 13px; }
.krit { display: flex; gap: 8px; align-items: baseline; }
.krit .k-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hold); flex: none; position: relative; top: 1px; }
.krit.hi .k-dot { background: var(--buy); } .krit.lo .k-dot { background: var(--sell); } .krit.mid .k-dot { background: var(--watch); } .krit.na .k-dot { background: none; border: 1px dashed var(--line); }
.krit .k-text { flex: 1; min-width: 0; }
.krit .k-name { font-weight: 500; }
.krit .k-sub { display: block; font-size: 11px; color: var(--muted); }
.krit .k-p { width: 28px; text-align: right; color: var(--muted); font-size: 12px; flex: none; }
.krit.na .k-name { color: var(--muted); }
.regler-wrap { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.hint.spar { color: var(--watch); }
.beslut { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.beslut-rad { display: grid; grid-template-columns: 92px 1fr auto 36px; grid-template-areas: "chip ticker dims score" "chip skal skal skal"; align-items: center; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.beslut-rad:first-child { border-top: none; }
.beslut-rad > .chip { grid-area: chip; text-align: center; }
.beslut-rad .b-ticker { grid-area: ticker; font-weight: 700; }
.beslut-rad .dims { grid-area: dims; }
.beslut-rad .b-score { grid-area: score; text-align: right; }
.beslut-rad .b-skal { grid-area: skal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stilar { display: flex; gap: 6px; flex-wrap: wrap; }
.vikter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 520px) { .vikter { grid-template-columns: 1fr 1fr; } }
.vikt { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.vikt input { width: 100%; }
input.inline { width: 64px; display: inline-block; padding: 4px 6px; margin: 0 4px; }
.krit-master > summary, .krit-grupp > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 6px 0; }
.krit-master > summary .dim-name, .krit-grupp > summary .dim-name { font-weight: 600; }
.krit-grupp { border-top: 1px solid var(--line); }
.krit-edit { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 10px; }
.krit-edit li { display: grid; gap: 4px; font-size: 13px; }
.krit-edit .k-name { font-weight: 600; margin-right: 8px; }
.ke-in { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.ke-in input { width: 70px; padding: 4px 6px; margin: 0 4px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 20; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
</style>

function kritPoang(k, v) {

function bedom(s, ctx) {
  const m = state.settings.modell;

  const owned = s.antal > 0;
  const typ = (a && a.profil && a.profil.typ) || 'vanlig';
  const dims = DIMS.map(d => {
    const kriterier = KRITERIER.filter(k => k.dim === d.id && kritGaller(k, typ)).map(k => {
      const v = kritFalt(s, a, ctx, k.falt);

    });

    const vikt = med.reduce((n, x) => n + x.k.vikt, 0);

  else if (score >= m.troskel.minska) verdict = owned ? 'minska' : 'undvik';

  // Skäl för och emot: starkaste kriterierna vägda med dimensionens vikt, plus flaggor och regler.

  const alla = [];
  dims.forEach(d => d.kriterier.forEach(x => { if (x.p != null && d.vikt > 0) alla.push({ p: x.p, styrka: (x.p - 0.5) * x.k.vikt * d.vikt, text: kritText(x.k, x.v), sub: d.kort + ' · ' + kritGransText(x.k), krit: x.k }); }));

  const skalFor = alla.filter(z => z.p >= 0.75).sort((p, q) => q.styrka - p.styrka);

function evalAll() { const ctx = ctxFor(state.stocks); return state.stocks.map(s => ({ stock: s, ev: evaluate(s, ctx), b: bedom(s, ctx), ctx })); }

/* ---------- Beslutslogg (facit) ---------- */
// En rad per aktie och dag: kurs, beslut och poäng vid dagens senaste beräkning. Gamla rader ändras aldrig,
// så loggen visar vad appen faktiskt sa – även om reglerna ändras senare.
function loggaBeslut() {
  const d = todayISO(), ctx = ctxFor(state.stocks);
  let changed = false;
  state.stocks.forEach(s => {
    if (!(s.kurs > 0)) return;
    const b = bedom(s, ctx);
    const e = { d, id: s.id, sym: s.symbol || '', t: s.ticker, k: s.kurs, fx: s.fxSek || 1, v: b.verdict, p: b.score };
    const i = state.logg.findIndex(x => x.d === d && x.id === s.id);
    if (i >= 0) { if (JSON.stringify(state.logg[i]) !== JSON.stringify(e)) { state.logg[i] = e; changed = true; } }
    else { state.logg.push(e); changed = true; }
  });
  if (state.logg.length > 8000) state.logg = state.logg.slice(-8000);
  return changed;
}
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function histPriceAt(sym, iso) { const h = state.hist[sym]; if (!h || !Array.isArray(h.priser)) return null; for (let i = 0; i < h.priser.length; i++) { if (h.priser[i][0] >= iso) return h.priser[i][1]; } return null; }
function utfall(e, dagar) { const mal = addDays(e.d, dagar); if (mal > todayISO() || !e.sym) return null; const c = histPriceAt(e.sym, mal); return isNum(c) && e.k > 0 ? c / e.k - 1 : null; }
function utfallNu(e) {
  const s = stockById(e.id);
  let k = s && s.kurs > 0 ? s.kurs : null;
  if (k == null) { const last = state.logg.filter(x => x.id === e.id).sort((a, b) => a.d.localeCompare(b.d)).pop(); k = last ? last.k : null; }
  return isNum(k) && e.k > 0 ? k / e.k - 1 : null;
}
// Händelser = när beslutet för en aktie ändras (eller första gången den loggas).
function facitEvents() {
  const byStock = {};
  state.logg.slice().sort((a, b) => a.d.localeCompare(b.d)).forEach(e => { (byStock[e.id] = byStock[e.id] || []).push(e); });
  const events = [];
  Object.keys(byStock).forEach(id => { let prev = null; byStock[id].forEach(e => { if (!prev || prev.v !== e.v) events.push(Object.assign({ fran: prev ? prev.v : null }, e)); prev = e; }); });
  events.sort((a, b) => b.d.localeCompare(a.d) || a.t.localeCompare(b.t, 'sv'));
  return events;
}
let histLoading = false;
function ensureHistory(events) {
  if (histLoading || !state.online) return;
  const today = todayISO();
  const need = {};
  events.forEach(e => { if (!e.sym || addDays(e.d, 7) > today) return; const h = state.hist[e.sym]; if (!h || !h.hamtad || Date.now() - Date.parse(h.hamtad) > 20 * 3600 * 1000) need[e.sym] = Math.min(need[e.sym] || 1e9, daysSince(e.d) || 0); });
  const syms = Object.keys(need);
  if (!syms.length) return;
  histLoading = true;
  (async () => {
    for (const sym of syms) {
      const age = need[sym];
      const range = age > 700 ? '5y' : age > 330 ? '2y' : '1y';
      try { const h = await api('/historik', { symbol: sym, range }); if (h && Array.isArray(h.priser)) { state.hist[sym] = { hamtad: new Date().toISOString(), valuta: h.valuta || null, priser: h.priser }; } }
      catch (e) { state.hist[sym] = state.hist[sym] || { hamtad: new Date().toISOString(), priser: [] }; }
    }
    store.saveHist();
    histLoading = false;
    if (state.view === 'facit') render();

}

/* ---------- Kompassen ---------- */
// Kompassen: poäng 0–100 på en halvcirkel. Röd zon under Minska-gränsen, grön från Köp-gränsen, grå däremellan.
function gaugeSVG(score, extra) {
  const t = state.settings.modell.troskel;
  const pt = (sc, r) => { const a = (180 - sc * 1.8) * Math.PI / 180; return [50 + r * Math.cos(a), 52 - r * Math.sin(a)]; };
  const arc = (s0, s1, klass) => {
    if (s1 <= s0) return '';
    const p0 = pt(s0, 42), p1 = pt(s1, 42);
    return '<path class="z ' + klass + '" fill="none" d="M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A42 42 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + '"/>';
  };
  const s = score == null ? 50 : Math.max(0, Math.min(100, score));
  const n = pt(s, 33);
  return '<svg class="gauge ' + (score == null ? 'none ' : '') + (extra || '') + '" viewBox="0 0 100 58" aria-hidden="true">' +
    arc(0, t.minska, 'z-salj') + arc(t.minska, t.behall, 'z-minska') + arc(t.behall, t.kop, 'z-behall') + arc(t.kop, 100, 'z-kop') +
    '<line class="needle" x1="50" y1="52" x2="' + n[0].toFixed(2) + '" y2="' + n[1].toFixed(2) + '"/><circle class="pivot" cx="50" cy="52" r="3.2"/></svg>';
}
// Sex små staplar, en per dimension (0–5). Tom stapel = går inte att bedöma.
function dimsHTML(dims, extra) {

    const p = d.poang;

    return '<i class="' + lvl + '" style="--h:' + (p == null ? 100 : Math.max(8, p / 5 * 100)) + '%" title="' + esc(d.namn + ': ' + (p == null ? 'saknas' : fmt(p, 1) + ' av 5')) + '"></i>';

}

    (hasEx ? '<div class="notice"><span>Exempelinnehav: antal och GAV är påhittade, kurser och nyckeltal hämtas på riktigt. Byt ut mot dina egna aktier när du vill.</span><button class="btn link" data-action="clear-examples">Ta bort exempel</button></div>' : '') +
    (errs.length ? '<div class="notice err"><span>Kunde inte hämta: ' + esc(errs.map(s => s.ticker).join(', ')) + ' – ' + esc(errs[0].fel) + '</span><button class="btn link" data-action="refresh-all">Försök igen</button></div>' : '') +
    '<section class="block"><div class="list-head"><h2>Innehav</h2><div class="actions">' +
      '<button class="btn" data-action="refresh-all"' + (refreshing ? ' disabled' : '') + '>' + (refreshing ? 'Uppdaterar…' : 'Uppdatera') + '</button><button class="btn primary" data-action="add-stock">+ Lägg till aktie</button></div></div>' +
      (owned.length ? '<ul class="stocks">' + owned.map(e => stockCard(e, ctx)).join('') + '</ul>' : '<p class="hint">Du äger inga aktier ännu. Lägg till en aktie med antal och GAV.</p>') +

    '<p class="hint center">' + (latest ? 'Senast hämtat ' + esc(fmtTime(latest)) + ' · ' : '') + 'Kurser hämtas automatiskt (Yahoo Finance) när appen öppnas, den fördjupade analysen en gång per dag. Beslutsstöd, inte finansiell rådgivning.</p>';
}

function ruleRow(r, scope) {
  return '<li class="rule' + (r.aktiv ? '' : ' off') + '">' +
    '<label class="switch"><input type="checkbox" id="tr-' + esc(r.id) + '" data-action="' + (scope === 'aktie' ? 'toggle-stock-rule' : 'toggle-rule') + '" data-id="' + esc(r.id) + '"' + (r.aktiv ? ' checked' : '') + ' aria-label="Aktiv"></label>' +
    '<div class="rule-body"><div class="rule-title">' + esc(ruleTitle(r)) + '</div>' + (r.namn ? '<div class="rule-sub">' + esc(r.namn) + '</div>' : '') + '</div>' +
    '<span class="rule-meta"><span class="chip ' + r.signal + '">' + SIG[r.signal] + '</span><span class="weight" title="Vikt ' + r.vikt + '">' + '●'.repeat(r.vikt) + '</span>' +
    '<button class="btn icon" data-action="' + (scope === 'aktie' ? 'edit-stock-rule' : 'edit-rule') + '" data-id="' + esc(r.id) + '">Ändra</button></span></li>';
}

function renderDetail() {
  const s = stockById(state.stockId);
  if (!s) { state.stockId = null; return renderPortfolio(); }
  const ctx = ctxFor(state.stocks), b = bedom(s, ctx), ev = b.ev, owned = s.antal > 0;
  const foreign = s.valuta && s.valuta !== 'SEK';
  const cur = foreign ? s.valuta : 'kr';
  const value = owned && s.kurs > 0 ? sek(s, s.antal * s.kurs) : null;
  const cost = owned && s.gav > 0 ? sek(s, s.antal * s.gav) : null;
  const utv = value != null && cost != null ? value - cost : null;
  const utvP = metricValue(s, 'utv_gav', ctx), vikt = metricValue(s, 'vikt', ctx);
  // Nyckeltal i grupper: först de beräknade, sedan de hämtade/inmatade per grupp.
  const groups = [];
  const grpOf = d => d.auto ? 'Beräknas i appen' : (d.grupp || 'Övriga nyckeltal');
  metricDefs().filter(d => d.id !== 'kurs').forEach(d => { const g = grpOf(d); let grp = groups.find(x => x.namn === g); if (!grp) { grp = { namn: g, rows: [] }; groups.push(grp); } grp.rows.push(d); });
  const metricRows = groups.map(g => '<tr class="grp"><th colspan="3">' + esc(g.namn) + '</th></tr>' + g.rows.map(d => {
    const v = metricValue(s, d.id, ctx);
    if (d.auto) return '<tr class="auto"><th scope="row">' + esc(d.namn) + '<div class="desc">' + esc(d.desc) + '</div></th><td class="val num">' + (v == null ? '<span class="muted">–</span>' : fmt(v, d.dec)) + '</td><td class="unit">' + esc(d.enhet) + '</td></tr>';
    const raw = s.varden[d.id];
    const autoTag = d.kalla && s.symbol ? (s.las[d.id] ? '<button class="tag lock" data-action="toggle-lock" data-id="' + esc(d.id) + '" title="Låst: skrivs inte över vid hämtning. Tryck för att låsa upp.">låst</button>' : '<button class="tag auto" data-action="toggle-lock" data-id="' + esc(d.id) + '" title="Hämtas automatiskt. Tryck för att låsa ett eget värde.">auto</button>') : '';
    return '<tr><th scope="row"><label for="m-' + esc(d.id) + '">' + esc(d.namn) + '</label>' + autoTag + (d.kalla ? '<div class="desc">' + esc(KALLOR[d.kalla] || '') + '</div>' : '') + '</th><td class="val">' +
      '<input id="m-' + esc(d.id) + '" class="num" inputmode="decimal" autocomplete="off" data-field="varden.' + esc(d.id) + '" value="' + inputVal(raw, 4) + '" placeholder="–">' +
      '</td><td class="unit">' + esc(d.enhet === 'kr' && foreign ? s.valuta : d.enhet) + '</td></tr>';
  }).join('')).join('');
  const checkRows = ev.rows.map(x => {
    const r = x.rule;
    const mark = x.status === 'uppfylld' ? '✓' : x.status === 'ej' ? '–' : '?';
    const klass = x.status === 'uppfylld' ? 'ok ' + r.signal : x.status === 'ej' ? 'no' : 'na';
    return '<li class="' + klass + '"><span class="mark">' + mark + '</span><span class="rc-text">' + esc(signalText(x)) + (r.namn ? ' <span class="muted">· ' + esc(r.namn) + '</span>' : '') + '</span>' +
      '<span class="rc-meta"><span class="chip sm ' + r.signal + '">' + SIG[r.signal] + '</span><span class="weight">' + '●'.repeat(r.vikt) + '</span>' + (r.scope === 'aktie' ? '<span class="tag">aktien</span>' : '') + '</span></li>';
  }).join('');
  const tx = s.transaktioner.slice().sort((a, b) => (b.datum || '').localeCompare(a.datum || ''));
  const stale = isStale(s);
  const fetchLine = s.symbol
    ? (s.fel ? '<span class="chip fel">Hämtning misslyckades</span> ' + esc(s.fel) : (s.hamtad ? 'Hämtat ' + esc(fmtTime(s.hamtad)) + ' · Yahoo Finance (' + esc(s.symbol) + ')' : 'Inte hämtat ännu')) + (stale && !s.fel ? ' · <span class="chip stale">Gammal kurs</span>' : '') +
      ' · <button class="btn link small" data-action="refresh-one"' + (refreshing ? ' disabled' : '') + '>Uppdatera nu</button>' + (s.varning ? '<br>' + esc(s.varning) : '')
    : 'Manuell kurs' + (s.kursDatum ? ' från ' + esc(fmtDate(s.kursDatum)) : '') + (stale ? ' · <span class="chip stale">Gammal kurs</span>' : '') + ' · <button class="btn link small" data-action="edit-stock">Koppla till automatisk hämtning</button>';
  return '<div class="detail">' +
    '<button class="btn back" data-action="back">← Portfölj</button>' +
    '<div class="d-head"><div><div class="d-ticker">' + esc(s.ticker) + (s.lista ? '<span class="chip lista">' + esc(s.lista) + '</span>' : '') + (foreign ? '<span class="chip lista">' + esc(s.valuta) + '</span>' : '') + (s.exempel ? '<span class="chip exempel">Exempel</span>' : '') + (owned ? '' : '<span class="chip">Bevakas</span>') + '</div><h1 class="d-name">' + esc(s.namn) + '</h1></div>' +
      '<div class="actions"><button class="btn" data-action="edit-stock">Redigera</button><button class="btn primary" data-action="trade">Köp / Sälj</button></div></div>' +
    '<section class="card d-price">' +
      '<div class="price-main"><label class="tile-label" for="kurs-input">Kurs</label>' +
        '<div class="price-input"><input id="kurs-input" class="num" inputmode="decimal" autocomplete="off" data-field="kurs" value="' + inputVal(s.kurs, 2, true) + '" placeholder="0,00"><span class="muted">' + esc(cur) + '</span>' + (isNum(s.forandring) ? '<span class="num ' + cls(s.forandring) + '">' + fmtSigned(s.forandring, 2) + ' %</span>' : '') + '</div>' +
        '<div class="hint">' + fetchLine + '</div></div>' +
      '<dl class="facts num">' +
        '<div><dt>Antal</dt><dd>' + (owned ? fmt(s.antal, 0) + ' st' : 'Äger inte') + '</dd></div>' +
        '<div><dt>GAV</dt><dd>' + (s.gav > 0 ? fmt(s.gav, 2) + ' ' + esc(cur) : '–') + '</dd></div>' +
        '<div><dt>Marknadsvärde</dt><dd>' + (value != null ? fmtKr(value) : '–') + '</dd></div>' +
        '<div><dt>Utveckling</dt><dd class="' + cls(utv) + '">' + (utv != null ? fmtSigned(utv, 0) + ' kr · ' + fmtPct(utvP, 1, true) : '–') + '</dd></div>' +
        '<div><dt>Portföljvikt</dt><dd>' + (owned ? fmtPct(vikt, 1) : '–') + '</dd></div>' +
        '<div><dt>Anskaffning</dt><dd>' + (cost != null ? fmtKr(cost) : '–') + '</dd></div>' +
        (foreign ? '<div><dt>Växelkurs</dt><dd>1 ' + esc(s.valuta) + ' = ' + fmt(s.fxSek, 2) + ' kr</dd></div>' : '') +
      '</dl>' +
    '</section>' +
    renderBedomning(s, b, ctx, checkRows) +
    '<section class="card"><div class="card-head"><h2>Nyckeltal</h2><a class="hint" href="#regler">Ändra listan</a></div>' +
      '<table class="metrics"><tbody>' + metricRows + '</tbody></table>' +
      '<p class="hint">' + (s.symbol ? 'Fält märkta <span class="tag auto">auto</span> fylls i vid varje hämtning. Vill du använda ett eget värde: skriv in det och tryck på auto så låses fältet.' : 'Skriv in värdena från bolagets rapport eller din mäklare. Tomt fält betyder att regler på det nyckeltalet hoppas över.') + '</p>' +
    '</section>' +
    '<section class="card"><div class="card-head"><h2>Regler för ' + esc(s.ticker) + '</h2><button class="btn sm" data-action="add-stock-rule">+ Regel</button></div>' +
      (s.regler.length ? '<ul class="rules">' + s.regler.map(r => ruleRow(r, 'aktie')).join('') + '</ul>' : '<p class="hint">Inga egna regler. Här passar t.ex. en målkurs: Kurs &gt; 330 kr → Sälj.</p>') +
      '<p class="hint">De allmänna reglerna under Regler gäller alltid också.</p>' +
    '</section>' +
    '<section class="card"><h2>Anteckning</h2><textarea id="note-input" data-field="anteckning" placeholder="Varför äger du aktien? Vad ska få dig att sälja?">' + esc(s.anteckning) + '</textarea></section>' +
    (tx.length ? '<section class="card"><h2>Affärer</h2><div class="table-scroll"><table class="tx"><thead><tr><th>Datum</th><th>Typ</th><th class="r">Antal</th><th class="r">Pris</th><th class="r">Belopp</th></tr></thead><tbody>' +
      tx.map(t => '<tr><td>' + esc(fmtDate(t.datum)) + '</td><td><span class="chip sm ' + t.typ + '">' + SIG[t.typ] + '</span></td><td class="num r">' + fmt(t.antal, 0) + '</td><td class="num r">' + fmt(t.pris, 2) + '</td><td class="num r">' + fmt(t.antal * t.pris, 0) + ' ' + esc(cur) +
        (t.typ === 'salj' && isNum(t.resultat) ? '<div class="small ' + cls(t.resultat) + '">' + fmtSigned(t.resultat, 0) + ' ' + esc(cur) + '</div>' : '') + '</td></tr>').join('') +
      '</tbody></table></div></section>' : '') +
    '<div class="danger-zone"><button class="btn danger" data-action="delete-stock">Ta bort aktien</button></div>' +
  '</div>';
}

// Bedömningskortet på aktiens sida: kompass, beslut, skäl för och emot, de sex dimensionerna med kriterier, flaggor och dina regler.
function renderBedomning(s, b, ctx, checkRows) {
  const owned = s.antal > 0, m = state.settings.modell;
  const stilNamn = STILAR[m.stil] ? STILAR[m.stil].namn : 'Egen stil';
  const li = (z, klass) => '<li class="' + klass + '"><span class="mark">' + (klass === 'for' ? '+' : '−') + '</span><span class="rc-text">' + esc(z.text) + (z.sub ? '<span class="sub">' + esc(z.sub) + '</span>' : '') + '</span></li>';
  const skal = (b.skalFor.length || b.skalEmot.length)
    ? '<div class="skal"><div><h3>Talar för</h3>' + (b.skalFor.length ? '<ul class="skal-list">' + b.skalFor.slice(0, 3).map(z => li(z, 'for')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div>' +
      '<div><h3>Talar emot</h3>' + (b.skalEmot.length ? '<ul class="skal-list">' + b.skalEmot.slice(0, 3).map(z => li(z, 'emot')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div></div>'
    : '';
  const dimRows = b.dims.map(d => {
    const p = d.poang;
    const krit = d.kriterier.map(x => {
      const k = x.k, g = x.p == null ? '' : x.p >= 0.75 ? 'hi' : x.p <= 0.25 ? 'lo' : 'mid';
      return '<li class="krit ' + (x.p == null ? 'na' : g) + '"><span class="k-dot"></span><span class="k-text"><span class="k-name">' + esc(k.namn) + '</span> <span class="num k-val">' + (x.p == null ? '<span class="muted">saknas</span>' : esc(kritText(k, x.v).slice(k.namn.length + 1))) + '</span>' +
        '<span class="k-sub">' + esc(kritGransText(k)) + ' · ' + esc(k.kalla) + '</span></span><span class="num k-p">' + (x.p == null ? '' : fmt(x.p * 5, 1)) + '</span></li>';
    }).join('');
    const sub = d.ingen && p == null ? 'ingen utdelning – räknas inte i den här stilen' : d.ingen ? 'ingen utdelning' : p == null ? (d.antal ? 'för få kriterier går att räkna (' + d.antal + ' av ' + d.av + ')' : 'ingen data') : d.antal + ' av ' + d.av + ' kriterier · vikt ' + fmt(d.vikt, 2).replace(/,?0+$/, '');
    return '<details class="dim ' + dimClass(p) + (d.vikt === 0 ? ' off' : '') + '"><summary><span class="dim-name">' + esc(d.namn) + '</span><span class="dim-bar"><i style="--w:' + (p == null ? 0 : p / 5 * 100) + '%"></i></span><span class="dim-p num">' + (p == null ? '–' : fmt(p, 1)) + '</span><span class="dim-sub">' + esc(sub) + '</span></summary>' +
      (krit ? '<ul class="krit-list">' + krit + '</ul>' : '<p class="hint">Inga kriterier gäller för den här bolagstypen.</p>') + '</details>';
  }).join('');
  const typNamn = { bank: 'bank', forsakring: 'försäkringsbolag', finans: 'finansbolag', investment: 'investmentbolag', fastighet: 'fastighetsbolag' }[b.typ];
  const analysLine = s.symbol
    ? (b.a ? 'Analys hämtad ' + esc(fmtTime(b.hamtad)) + ' · Yahoo Finance' + (b.a.profil && b.a.profil.bransch ? ' · ' + esc(b.a.profil.bransch) : '') + (typNamn ? ' · bedöms som ' + typNamn : '') + (b.a.saknas && b.a.saknas.length ? ' · saknas: ' + esc(b.a.saknas.join(', ')) : '') + (analysVarden(s, b.a)._omraknad ? ' · kursbaserade mått omräknade till din kurs ' + fmt(s.kurs, 2) + ' (källans ' + fmt(b.a.kurs, 2) + ' från ' + esc(fmtDate(b.a.kursTid)) + ')' : '') + (b.a.opalitlig && b.a.opalitlig.indexOf('vinst') >= 0 ? ' · vinstbaserade kriterier hoppas över (orimlig vinst i källan)' : '')
      : (s.analysFel ? 'Analysen kunde inte hämtas: ' + esc(s.analysFel) : 'Analysen hämtas vid nästa uppdatering')) + ' · <button class="btn link small" data-action="refresh-analys"' + (refreshing ? ' disabled' : '') + '>Hämta analys igen</button>'
    : 'Ingen automatisk hämtning – bara dina egna regler kan bedömas. <button class="btn link small" data-action="edit-stock">Koppla till Yahoo-symbol</button>';
  const sparText = b.regelSkal.filter(z => z.typ === 'spar');
  return '<section class="card d-verdict">' +
      '<div class="gauge-wrap">' + gaugeSVG(b.score) + '<div class="verdict-label ' + verdictClass(b.verdict) + '">' + verdictLabel(b.verdict, owned) + '</div>' +
        '<div class="score num">' + (b.score == null ? 'Går inte att bedöma ännu' : 'Poäng ' + b.score + ' av 100 · ' + esc(stilNamn) + (b.justering ? ' · regler ' + fmtSigned(b.justering, 0) : '')) + '</div></div>' +
      '<div class="verdict-text">' +
        (b.score == null ? '<p class="lead">' + (s.symbol ? 'När analysen är hämtad bedöms aktien i sex dimensioner enligt etablerade kriterier.' : 'Koppla aktien till en Yahoo-symbol så hämtas allt modellen behöver.') + '</p>' : skal) +
        (b.flaggor.length ? '<div class="flaggor"><h3>Röda flaggor</h3><ul>' + b.flaggor.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>' : '') +
      '</div>' +
      '<div class="dims-wrap">' + dimRows + '</div>' +
      (b.ev.rows.length ? '<div class="regler-wrap"><h3>Dina regler</h3>' + (sparText.length ? '<p class="hint spar">Köp-dippen-spärren håller tillbaka: ' + esc(sparText.map(z => z.text).join('; ')) + ' – kvalitet och styrka måste vara minst ' + fmt(m.sparNiva, 1) + ' av 5.</p>' : '') + '<ul class="rule-check">' + checkRows + '</ul></div>' : '') +
      '<p class="hint">' + analysLine + '</p>' +
    '</section>';
}

function renderSignals() {
  const evals = evalAll();
  const signals = allSignals();
  const kopN = signals.filter(x => x.row.rule.signal === 'kop').length, saljN = signals.length - kopN;
  const stale = state.stocks.filter(s => isStale(s) || s.fel);
  const order = { kop_mer: 0, kop: 0, salj: 1, minska: 2, undvik: 2, behall: 3, avvakta: 3, bevaka: 3, saknas: 4 };
  const byVerdict = evals.slice().sort((a, b) => (order[a.b.verdict] - order[b.b.verdict]) || ((b.b.score || 0) - (a.b.score || 0)) || a.stock.ticker.localeCompare(b.stock.ticker, 'sv'));
  const radKop = evals.filter(x => KOPSIDA.indexOf(x.b.verdict) >= 0).length, radSalj = evals.filter(x => SALJSIDA.indexOf(x.b.verdict) >= 0).length;
  return '<section class="summary three">' +
      '<div class="tile"><div class="tile-label">Köpråd</div><div class="tile-value num pos">' + radKop + '</div><div class="tile-sub">' + kopN + ' egna köpsignaler</div></div>' +
      '<div class="tile"><div class="tile-label">Sälj / minska</div><div class="tile-value num neg">' + radSalj + '</div><div class="tile-sub">' + saljN + ' egna säljsignaler</div></div>' +
      '<div class="tile"><div class="tile-label">Behöver data</div><div class="tile-value num" style="color:var(--watch)">' + stale.length + '</div><div class="tile-sub">gammal kurs eller fel</div></div>' +
    '</section>' +
    (state.stocks.length ? '<section class="card"><div class="card-head"><h2>Beslut just nu</h2><button class="btn primary sm" data-action="refresh-all"' + (refreshing ? ' disabled' : '') + '>' + (refreshing ? 'Uppdaterar…' : 'Uppdatera') + '</button></div>' +
      '<ul class="beslut">' + byVerdict.map(x => '<li class="beslut-rad" data-action="open-stock" data-id="' + esc(x.stock.id) + '" tabindex="0" role="button"><span class="chip ' + verdictClass(x.b.verdict) + '">' + verdictLabel(x.b.verdict, x.stock.antal > 0) + '</span><span class="b-ticker">' + esc(x.stock.ticker) + '</span>' + dimsHTML(x.b.dims, 'sm') + '<span class="num b-score">' + (x.b.score == null ? '–' : x.b.score) + '</span><span class="b-skal small muted">' + esc(x.b.skalEmot[0] ? '− ' + x.b.skalEmot[0].text : (x.b.skalFor[0] ? '+ ' + x.b.skalFor[0].text : '')) + '</span></li>').join('') + '</ul>' +
      '<p class="hint">Poäng 0–100 med stilen ' + esc(STILAR[state.settings.modell.stil] ? STILAR[state.settings.modell.stil].namn : 'Egen') + '. Öppna aktien för skälen och alla kriterier.</p></section>' : '') +
    '<section class="block"><div class="list-head"><h2>Dina signaler</h2><span class="hint">Egna regler som är uppfyllda just nu</span></div>' +
      (signals.length ? '<ul class="signals">' + signals.map(x => {
        const r = x.row.rule;
        return '<li class="signal ' + r.signal + '" data-action="open-stock" data-id="' + esc(x.stock.id) + '" tabindex="0" role="button">' +
          '<span class="chip ' + r.signal + '">' + SIG[r.signal] + '</span>' +
          '<div class="sig-body"><div class="sig-title">' + esc(x.stock.ticker) + (r.namn ? ' <span class="muted">· ' + esc(r.namn) + '</span>' : '') + '</div><div class="sig-text num">' + esc(signalText(x.row)) + '</div></div>' +
          '<span class="weight" title="Vikt ' + r.vikt + '">' + '●'.repeat(r.vikt) + '</span></li>';
      }).join('') + '</ul>' : '<div class="card empty"><p>Inga regler är uppfyllda just nu.' + (state.stocks.length ? '' : ' Lägg till aktier under Portfölj.') + '</p></div>') +
    '</section>' +
    (stale.length ? '<section class="block"><div class="list-head"><h2>Behöver ny data</h2></div><ul class="signals">' + stale.map(s => '<li class="signal" data-action="open-stock" data-id="' + esc(s.id) + '" tabindex="0" role="button"><span class="chip ' + (s.fel ? 'fel' : 'stale') + '">' + (s.fel ? 'Fel' : 'Gammal') + '</span><div class="sig-body"><div class="sig-title">' + esc(s.ticker) + ' <span class="muted">· ' + esc(s.namn) + '</span></div><div class="sig-text">' + esc(s.fel ? s.fel : (s.symbol ? (s.hamtad ? 'Hämtat ' + fmtTime(s.hamtad) : 'Inte hämtat ännu') : (s.kursDatum ? 'Manuell kurs från ' + fmtDate(s.kursDatum) : 'Kursdatum saknas'))) + '</div></div></li>').join('') + '</ul></section>' : '') +
    '<p class="hint center">Signalerna räknas om varje gång kurser och nyckeltal hämtas eller när du ändrar något.</p>';
}

function renderFacit() {
  const today = todayISO();
  if (!state.logg.length) {
    return '<div class="card empty">' + compassIcon() + '<h2>Facit kommer med tiden</h2><p>Varje gång kurser hämtas antecknar appen vilket beslut den gav för varje aktie och till vilken kurs. Här ser du sedan hur kursen gick efter varje köp- och säljråd, en vecka, en månad och tre månader senare.</p></div>';
  }
  const events = facitEvents();
  ensureHistory(events);
  const first = state.logg.map(e => e.d).sort()[0];
  const dagar = daysSince(first) || 0;
  const horis = [['nu', 'Hittills'], [7, '1 vecka'], [30, '1 månad'], [90, '3 mån']];
  // Grupper: köpsidan (Köp, Köp mer), säljsidan (Sälj, Minska, Undvik) och neutrala (Behåll, Avvakta, Bevaka).
  const grupp = v => KOPSIDA.indexOf(v) >= 0 ? 'kop' : SALJSIDA.indexOf(v) >= 0 ? 'salj' : v === 'bevaka' ? 'bevaka' : 'behall';
  const stat = {};
  ['kop', 'salj', 'bevaka', 'behall'].forEach(v => {
    stat[v] = {};
    horis.forEach(h => {
      const rs = [];
      events.filter(e => grupp(e.v) === v && e.d !== today).forEach(e => { const r = h[0] === 'nu' ? utfallNu(e) : utfall(e, h[0]); if (isNum(r)) rs.push(r); });
      stat[v][h[0]] = { n: rs.length, avg: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length * 100 : null, hit: rs.length ? rs.filter(r => v === 'salj' ? r < 0 : r > 0).length / rs.length * 100 : null };
    });
  });
  const tile = (v, label) => {
    const st = stat[v], best = st[30].n ? st[30] : st.nu, bestLabel = st[30].n ? 'efter 1 mån' : 'hittills';
    return '<div class="tile"><div class="tile-label">' + label + '</div><div class="tile-value num ' + (best.avg == null ? '' : cls(v === 'salj' ? -best.avg : best.avg)) + '">' + (best.avg == null ? '–' : fmtSigned(best.avg, 1) + ' %') + '</div><div class="tile-sub">' + (best.n ? 'snitt ' + bestLabel + ' · ' + fmt(best.hit, 0) + ' % ' + (v === 'salj' ? 'föll' : 'steg') + ' · ' + best.n + ' råd' : 'inga råd att utvärdera ännu') + '</div></div>';
  };
  const cell = r => isNum(r) ? '<span class="' + cls(r) + '">' + fmtSigned(r * 100, 1) + ' %</span>' : '<span class="muted">–</span>';
  const rows = events.slice(0, 80).map(e => '<tr><td class="w"><b>' + esc(e.t) + '</b><div class="small muted">' + esc(fmtDate(e.d)) + '</div></td><td>' + (e.fran ? '<span class="chip sm ' + verdictClass(e.fran) + '">' + esc(verdictLabel(e.fran, true)) + '</span> → ' : '') + '<span class="chip sm ' + verdictClass(e.v) + '">' + esc(verdictLabel(e.v, true)) + '</span></td><td class="num r">' + cell(utfallNu(e)) + '</td><td class="num r">' + cell(utfall(e, 7)) + '</td><td class="num r">' + cell(utfall(e, 30)) + '</td><td class="num r">' + cell(utfall(e, 90)) + '</td><td class="num r muted">' + fmt(e.k, 2) + '</td></tr>').join('');
  const baseline = stat.bevaka.nu.n + stat.behall.nu.n ? 'Som jämförelse: aktier med Bevaka/Behåll har i snitt gått ' + fmtSigned(((stat.bevaka.nu.avg || 0) * stat.bevaka.nu.n + (stat.behall.nu.avg || 0) * stat.behall.nu.n) / (stat.bevaka.nu.n + stat.behall.nu.n), 1) + ' % sedan beslutet.' : '';
  return '<div class="facit">' +
    '<section class="summary" style="grid-template-columns:1fr 1fr">' + tile('kop', 'Köpråd') + tile('salj', 'Säljråd') + '</section>' +
    '<section class="card"><div class="card-head"><h2>Beslut och utfall</h2><span class="hint">' + (histLoading ? '<span class="spinner"></span> hämtar historik…' : 'Loggat sedan ' + esc(fmtDate(first)) + ' · ' + dagar + (dagar === 1 ? ' dag' : ' dagar')) + '</span></div>' +
      '<p class="lead">Varje rad är ett tillfälle då appens beslut för en aktie ändrades. Utvecklingen räknas från kursen den dagen. ' + baseline + '</p>' +
      '<div class="table-scroll"><table class="tx"><thead><tr><th>Aktie</th><th>Beslut</th><th class="r">Hittills</th><th class="r">1 v</th><th class="r">1 mån</th><th class="r">3 mån</th><th class="r">Kurs då</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (events.length > 80 ? '<p class="hint">Visar de 80 senaste av ' + events.length + '.</p>' : '') +
    '</section>' +
    '<p class="hint center">' + (dagar < 60 ? 'Träffsäkerhet går att bedöma först efter några månader och ett tjugotal råd. ' : '') + 'Råd före ' + esc(fmtDate('2026-11-17')) + ' kommer från den gamla regelmodellen (poäng −100…+100), senare från analysmodellen (0–100). Loggen sparas bara i den här enheten och följer med i säkerhetskopian.</p>' +
  '</div>';
}

        '<p class="hint">' + esc(stil ? stil.desc : 'Egna vikter. Välj en stil för att återgå till färdiga vikter.') + '</p></div>' +
      '<div class="field"><span class="lbl">Dimensionernas vikter (0 = räknas inte, 3 = väger tyngst)</span><div class="vikter">' + vikterHtml + '</div></div>' +

        '<label><span class="chip behall">Behåll / Avvakta</span> från <input class="num" inputmode="numeric" data-field="modell.troskel.behall" value="' + m.troskel.behall + '"> poäng</label>' +

      '</div>' +
      '<label class="check"><input type="checkbox" data-field="modell.spar"' + (m.spar ? ' checked' : '') + '> Köp-dippen-spärr: köpregler på kursnedgång slår bara igenom när Kvalitet och Finansiell styrka är minst <input class="num inline" inputmode="decimal" data-field="modell.sparNiva" value="' + inputVal(m.sparNiva, 1) + '"> av 5</label>' +
      '<details class="krit-master"><summary><span class="dim-name">Kriterier och gränsvärden</span><span class="hint">' + KRITERIER.length + ' kriterier · tryck för att se och ändra</span></summary>' +
        '<p class="hint">Ett kriterium ger full poäng vid "bra"-gränsen eller bättre, noll vid "dålig"-gränsen eller sämre och däremellan en glidande skala. Banker, försäkrings- och investmentbolag bedöms med egna kriterier (P/B, ROE, soliditet på banknivå) och slipper F-score, Z-score och skuldmått.</p>' + kritHtml + '</details>' +
    '</section>';
}

      '<div class="btn-row"><button class="btn" data-action="export">Säkerhetskopia (JSON)</button><button class="btn" data-action="import">Läs in säkerhetskopia</button>' + (state.stocks.some(s => s.exempel) ? '<button class="btn" data-action="clear-examples">Ta bort exempeldata</button>' : '') + '</div>' +
