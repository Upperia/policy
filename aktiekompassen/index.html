<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktiekompassen</title>
<meta name="description" content="Din egen aktieportfölj med nyckeltal, köp- och säljregler och en kompass som visar beslutsläget per aktie.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D28" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aktiekompassen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: en kolumn (max 760px), sticky huvud med varumärke + tre flikar, kort för innehav,
   formulär som bottenark på mobil och centrerad dialog på dator. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E8ECF2;
  --fg: #141A24;
  --muted: #5C6778;
  --line: #D6DCE6;
  --accent: #1F4FD8;
  --accent-fg: #FFFFFF;
  --accent-soft: #E3EAFB;
  --buy: #15803D;  --buy-bg: #DCF5E6;
  --sell: #C0243A; --sell-bg: #FCE4E8;
  --watch: #B45309; --watch-bg: #FDEBD2;
  --hold: #5C6778; --hold-bg: #E8ECF2;
  --backdrop: rgba(10, 14, 22, .5);
  --shadow: 0 1px 2px rgba(20,26,36,.06), 0 6px 20px rgba(20,26,36,.08);
  --font-ui: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --surface-2: #1F2834; --fg: #E7ECF3; --muted: #97A2B3; --line: #2A3442;
    --accent: #86A4FF; --accent-fg: #0E131B; --accent-soft: #1C2A4D;
    --buy: #4ADE80; --buy-bg: #11301F; --sell: #FB7185; --sell-bg: #3B1621; --watch: #FBBF24; --watch-bg: #3A2B0C;
    --hold: #97A2B3; --hold-bg: #1F2834; --backdrop: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1F2834; --fg: #E7ECF3; --muted: #97A2B3; --line: #2A3442;
  --accent: #86A4FF; --accent-fg: #0E131B; --accent-soft: #1C2A4D;
  --buy: #4ADE80; --buy-bg: #11301F; --sell: #FB7185; --sell-bg: #3B1621; --watch: #FBBF24; --watch-bg: #3A2B0C;
  --hold: #97A2B3; --hold-bg: #1F2834; --backdrop: rgba(0,0,0,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.pos { color: var(--buy); }
.neg { color: var(--sell); }
.r { text-align: right; }
.center { text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Huvud */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.02em; font-size: 17px; padding-block: 12px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.brand .status-line { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { position: relative; padding: 15px 12px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; line-height: 18px; text-align: center; font-family: var(--font-num); margin-left: 4px; vertical-align: 1px; }
.badge:empty { display: none; }
@media (max-width: 520px) {
  .brand { padding-block: 10px 0; }
  .tabs { width: 100%; margin-left: 0; }
  .tab { flex: 1; text-align: center; padding: 8px 2px 10px; font-size: 13.5px; }
}
.facit .tx { font-size: 12.5px; }
.facit .tx td, .facit .tx th { white-space: nowrap; padding-left: 6px; }
.facit .tx td:first-child, .facit .tx th:first-child { padding-left: 0; }
.facit .tx td.w { min-width: 7ch; }
.facit .tx .chip.sm { font-size: 9.5px; padding: 1px 5px; }
.facit .facit-h3 { font-size: 14px; margin: 14px 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.facit .bt-stil { margin: 10px 0 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.facit .bt-stil-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.facit .bt-stil .tx { width: 100%; margin: 6px 0; }
.facit .bt-stil .tx td:first-child { white-space: normal; }
.facit .tx td .small { font-size: 10.5px; line-height: 1.3; }
.facit .hint.neg { color: var(--sell); }

/* Sida */
.wrap { max-width: 760px; margin: 0 auto; padding-block: 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.block { display: grid; gap: 10px; min-width: 0; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.list-head h2, .card h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 12.5px; color: var(--muted); }
.lead { font-size: 13.5px; color: var(--muted); max-width: 60ch; }
.notice { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.notice.warn { background: var(--watch-bg); }
.notice.err { background: var(--sell-bg); }

/* Knappar */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 14px; cursor: pointer; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--sell); border-color: var(--sell); background: transparent; }
.btn.link { border: none; background: none; color: var(--accent); padding: 0; }
.btn.icon { padding: 6px 9px; font-size: 13px; }
.btn.sm { padding: 5px 9px; font-size: 13px; }

/* Sammanfattning */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.summary.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 600px) { .summary { grid-template-columns: 1fr 1fr; } .summary.three .tile { padding: 10px 12px; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile-value { font-size: 21px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.tile-sub { font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 8px; vertical-align: 1px; }
.dot:first-child { margin-left: 0; }
.dot.kop { background: var(--buy); } .dot.salj { background: var(--sell); } .dot.watch { background: var(--watch); }

/* Kort */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Aktiekort */
.stocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.stock-card { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.stock-card:hover { border-color: var(--accent); }
.sc-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.sc-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticker { font-weight: 800; letter-spacing: -0.01em; }
.name { color: var(--muted); font-size: 13px; }
.sc-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
.sc-row .val { font-weight: 500; }
.sc-verdict { display: grid; justify-items: center; gap: 2px; width: 76px; flex: none; }
.sc-verdict svg { width: 66px; height: auto; }

/* Chips */
.chip { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--hold-bg); color: var(--hold); white-space: nowrap; line-height: 1.5; }
.chip.kop { background: var(--buy-bg); color: var(--buy); }
.chip.salj { background: var(--sell-bg); color: var(--sell); }
.chip.bevaka { background: var(--watch-bg); color: var(--watch); }
.chip.behall, .chip.saknas { background: var(--hold-bg); color: var(--hold); }
.chip.exempel { background: var(--accent-soft); color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.lista { background: var(--surface-2); color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.stale, .chip.fel { background: var(--watch-bg); color: var(--watch); text-transform: none; letter-spacing: 0; font-weight: 600; }
.chip.fel { background: var(--sell-bg); color: var(--sell); }
.chip.sm { font-size: 10px; padding: 1px 6px; }

/* Kompass */
.gauge .z { fill: none; stroke-width: 9; }
.gauge .z-salj { stroke: var(--sell); }
.gauge .z-behall { stroke: var(--surface-2); }
.gauge .z-kop { stroke: var(--buy); }
.gauge .needle { stroke: var(--fg); stroke-width: 2.6; stroke-linecap: round; }
.gauge .pivot { fill: var(--fg); }
.gauge.none .needle, .gauge.none .pivot { opacity: .3; }

/* Detalj */
.detail { display: grid; gap: 14px; }
.back { justify-self: start; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.d-ticker { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.d-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.d-price { grid-template-columns: 1fr 1.3fr; align-items: start; gap: 16px; }
@media (max-width: 560px) { .d-price { grid-template-columns: 1fr; } }
.price-main { display: grid; gap: 4px; }
.price-input { display: flex; align-items: baseline; gap: 6px; }
.price-input input { font-size: 26px; font-weight: 500; padding: 4px 8px; width: 100%; max-width: 190px; }
.price-big { font-size: 26px; font-weight: 500; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0; }
.facts > div { display: grid; gap: 1px; min-width: 0; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; font-family: var(--font-ui); }
.facts dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.d-verdict { grid-template-columns: 190px 1fr; align-items: center; gap: 16px; }
@media (max-width: 560px) { .d-verdict { grid-template-columns: 1fr; } }
.gauge-wrap { display: grid; justify-items: center; gap: 2px; }
.gauge-wrap svg { width: 170px; max-width: 100%; height: auto; }
.verdict-label { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
.verdict-label.kop { color: var(--buy); } .verdict-label.salj { color: var(--sell); } .verdict-label.bevaka { color: var(--watch); } .verdict-label.behall, .verdict-label.saknas { color: var(--muted); }
.score { font-size: 13px; color: var(--muted); }
.verdict-text { display: grid; gap: 8px; min-width: 0; }
.rule-check { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
.rule-check li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rule-check .mark { width: 16px; flex: none; font-weight: 800; text-align: center; }
.rule-check .ok.kop .mark { color: var(--buy); }
.rule-check .ok.salj .mark { color: var(--sell); }
.rule-check .no .mark, .rule-check .na { color: var(--muted); }
.rule-check .rc-text { flex: 1; min-width: 12ch; }
.rc-meta { display: inline-flex; gap: 6px; align-items: center; }
.weight { font-family: var(--font-num); font-size: 10px; letter-spacing: 2px; color: var(--muted); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; background: none; line-height: 1.5; }
button.tag { cursor: pointer; }
.tag.auto { color: var(--accent); border-color: var(--accent); }
.tag.lock { color: var(--watch); border-color: var(--watch); }

.metrics { width: 100%; border-collapse: collapse; }
.metrics th { text-align: left; font-weight: 500; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.metrics td { padding: 6px 0 6px 8px; border-top: 1px solid var(--line); }
.metrics tr.grp th { border-top: none; padding: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.metrics tr.grp:first-child th { padding-top: 0; }
.metrics tr.grp + tr th, .metrics tr.grp + tr td { border-top: none; }
.metrics td.val { width: 120px; text-align: right; }
.metrics td.unit { width: 34px; color: var(--muted); font-size: 13px; }
.metrics input { padding: 6px 8px; }
.metrics .desc { font-size: 11.5px; color: var(--muted); font-weight: 400; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rule { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); flex-wrap: wrap; }
.rule.off { opacity: .55; }
.rule-body { flex: 1; min-width: 14ch; }
.rule-title { font-weight: 600; }
.rule-sub { font-size: 12px; color: var(--muted); }
.rule-meta { display: inline-flex; align-items: center; gap: 8px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; display: block; cursor: pointer; }

.tx { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tx th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 4px 0; }
.tx td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tx th.r, .tx td.r { text-align: right; padding-left: 8px; }
.table-scroll { overflow-x: auto; }

textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 72px; resize: vertical; }
input[type="text"], input:not([type]), input[type="search"], input[type="date"], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input.num { font-family: var(--font-num); text-align: right; }
input::placeholder { color: var(--muted); opacity: .8; }
.danger-zone { display: flex; justify-content: flex-end; }

/* Signaler */
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.signal { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
.signal:hover { border-color: var(--accent); }
.signal > .chip { min-width: 56px; text-align: center; }
.signal.kop { border-left-color: var(--buy); }
.signal.salj { border-left-color: var(--sell); }
.sig-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.sig-title { font-weight: 600; }
.sig-text { font-size: 13px; color: var(--muted); }
.verdict-row { display: flex; gap: 8px; flex-wrap: wrap; }
.verdict-row .btn { display: inline-flex; gap: 8px; align-items: center; }

.metrics-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.metrics-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.metrics-list li:first-child { border-top: none; }
.metrics-list .m-name { flex: 1; min-width: 14ch; }
.metrics-list .m-unit { color: var(--muted); font-size: 13px; width: 34px; }
.thresholds { display: grid; gap: 10px; }
.thresholds label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.thresholds input { width: 72px; }
.status { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.status .dot { margin: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tomt / laddar */
.empty { text-align: center; padding: 36px 16px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 56px; height: 56px; color: var(--accent); }
.empty p { max-width: 46ch; color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; display: inline-block; vertical-align: -4px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* Dialog */
dialog { border: none; border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--backdrop); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px 0; }
.sheet-head h2 { font-size: 17px; font-weight: 700; }
.sheet-body { padding: 12px 16px 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg label { flex: 1; text-align: center; padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
.seg label + label { border-left: 1px solid var(--line); }
.seg input { position: absolute; opacity: 0; width: 0; height: 0; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-fg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.form-error { color: var(--sell); font-size: 13px; font-weight: 600; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
.export-area { width: 100%; min-height: 160px; font-family: var(--font-num); font-size: 12px; }
.sok-res { display: grid; gap: 6px; min-height: 48px; }
.sok-hit { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 10px; }
.sok-hit .sh-sym { font-weight: 800; min-width: 9ch; }

function normalizeRule(r) {
  return { id: String(r.id || uid()), metric: String(r.metric), op: ['<', '<=', '>', '>='].includes(r.op) ? r.op : '<',
    value: num(r.value) == null ? 0 : num(r.value), signal: r.signal === 'salj' ? 'salj' : 'kop', vikt: clampInt(r.vikt, 1, 3, 1),
    aktiv: r.aktiv !== false, namn: String(r.namn || '') };
}
function normalizeMetric(m) {

  if (m.kalla && KALLOR[m.kalla]) out.kalla = String(m.kalla);
  if (m.grupp) out.grupp = String(m.grupp);
  return out;
}
const numIn = (v, lo, hi, def) => { const n = num(v); return n == null ? def : Math.max(lo, Math.min(hi, n)); };
function normalizeModell(raw) {
  const m = clone(DEFAULT_MODELL);
  if (!raw || typeof raw !== 'object') return m;
  if (STILAR[raw.stil] || raw.stil === 'egen') m.stil = raw.stil;
  if (raw.vikter && typeof raw.vikter === 'object') DIMS.forEach(d => { m.vikter[d.id] = numIn(raw.vikter[d.id], 0, 3, m.vikter[d.id]); });
  if (raw.troskel && typeof raw.troskel === 'object') { m.troskel.kop = numIn(raw.troskel.kop, 1, 100, 70); m.troskel.behall = numIn(raw.troskel.behall, 1, 100, 50); m.troskel.minska = numIn(raw.troskel.minska, 0, 100, 35); }
  if (m.troskel.behall > m.troskel.kop) m.troskel.behall = m.troskel.kop; if (m.troskel.minska > m.troskel.behall) m.troskel.minska = m.troskel.behall;
  m.spar = raw.spar !== false;
  m.sparNiva = numIn(raw.sparNiva, 0, 5, 2.5);
  if (raw.granser && typeof raw.granser === 'object') Object.keys(raw.granser).forEach(id => {
    const k = KRIT_BY_ID[id], g = raw.granser[id];
    if (!k || !g || typeof g !== 'object') return;
    if (k.typ === 'band') return; // band-gränser ändras inte i appen
    const bra = num(g.bra), dalig = num(g.dalig);
    if (bra == null || dalig == null || bra === dalig) return;
    if ((bra > dalig) !== (k.bra > k.dalig)) return; // riktningen får inte vändas
    m.granser[id] = { bra, dalig };
  });
  m.risk = clone(DEFAULT_RISK);
  if (raw.risk && typeof raw.risk === 'object') RISKREGLER.forEach(r => {
    const x = raw.risk[r.id]; if (!x || typeof x !== 'object') return;
    m.risk[r.id].aktiv = x.aktiv !== false;
    m.risk[r.id].varde = numIn(x.varde, 0, 1000, r.varde);
    if (['salj', 'minska', 'varna', 'villkorad'].indexOf(x.atgard) >= 0 && (x.atgard !== 'villkorad' || r.atgard === 'villkorad')) m.risk[r.id].atgard = x.atgard;
  });
  // Den gamla standardregeln "För stor andel" (vikt > 25 % → Sälj) ersätts av riskregeln Maxvikt per aktie.
  return m;
}
function normalizeSettings(raw) {
  const s = clone(DEFAULT_SETTINGS);
  if (!raw || typeof raw !== 'object') return s;
  if (Array.isArray(raw.metrics)) s.metrics = raw.metrics.filter(m => m && m.id && m.namn).map(normalizeMetric);
  if (Array.isArray(raw.rules)) {
    s.rules = raw.rules.filter(r => r && r.metric).map(normalizeRule);
    // Uppgradering från regelmodellen: standardregler som modellen täcker tas bort om de är orörda.
    if (!raw.modell) s.rules = s.rules.filter(r => { const g = GAMLA_REGLER[r.id]; return !(g && g.metric === r.metric && g.op === r.op && g.value === r.value && g.signal === r.signal); });

/* ---------- Hämtning av kurser och nyckeltal ---------- */
async function api(path, params) {
  const u = new URL(API + path);
  Object.keys(params || {}).forEach(k => u.searchParams.set(k, params[k]));
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    // Ingen webbläsarcache: appen har egen daglig cache för analysen, och kurser ska alltid vara färska.
    const r = await fetch(u.toString(), { headers: { 'x-region': 'us-east-1' }, signal: ctrl.signal, cache: 'no-store' });
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (!r.ok || !j || (j && j.error)) throw new Error((j && j.error) || ('Servern svarade ' + r.status));
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Hämtningen tog för lång tid');
    if (e instanceof TypeError) throw new Error('Ingen kontakt med servern');
    throw e;
  } finally { clearTimeout(t); }
}
function applyQuote(s, q) {
  const tidDatum = q.kursTid ? String(q.kursTid).slice(0, 10) : null;
  s.kallaGammal = !!(tidDatum && daysSince(tidDatum) > 7);
  if (isNum(q.kurs) && q.kurs > 0) {
    // Om källan saknar färsk kurs och du själv skrivit in en nyare, behålls din.
    if (!(s.kallaGammal && s.kursDatum && s.kursDatum > tidDatum)) { s.kurs = q.kurs; s.kursDatum = tidDatum || todayISO(); }
  }
  s.kursTid = q.kursTid || s.kursTid;
  s.forandring = isNum(q.forandring) ? q.forandring : null;
  if (q.valuta) s.valuta = q.valuta;
  if (isNum(q.fxSek) && q.fxSek > 0) s.fxSek = q.fxSek; else if (s.valuta === 'SEK') s.fxSek = 1;
  if (!s.namn && q.namn) s.namn = q.namn;
  const nk = q.nyckeltal || {};
  state.settings.metrics.forEach(m => {
    if (!m.kalla || s.las[m.id]) return;
    const v = nk[m.kalla];
    if (isNum(v)) s.varden[m.id] = round4(v); else delete s.varden[m.id];
  });
  s.hamtad = new Date().toISOString();
  s.fel = null;

// Riskkontroll: går igenom riskreglerna för en aktie. Returnerar träffar med nivå (0 sälj, 1 minska, 2 högst behåll, null = bara varning).
function riskKontroll(s, a, ctx, o) {
  const m = state.settings.modell, R = m.risk, v = analysVarden(s, a);
  const traffar = [];
  const fundamentaTraff = [];
  const atgardText = at => ({ salj: 'Sälj', minska: 'Minska', varna: 'varning', villkorad: 'Sälj om fundamenta sviktar, annars högst Behåll' })[at] || at;
  const push = (id, text, extra) => {
    const r = R[id], def = RISK_BY_ID[id];
    const t = Object.assign({ id, namn: def.namn, text, atgard: r.atgard, atgardText: atgardText(r.atgard), niva: null }, extra || {});
    if (r.atgard === 'salj') t.niva = 0; else if (r.atgard === 'minska') t.niva = 1;
    traffar.push(t);
    if (FUNDAMENTA_REGLER.indexOf(id) >= 0) fundamentaTraff.push(t);
    return t;
  };
  const on = id => R[id] && R[id].aktiv;
  // Fundamenta
  if (on('fscore') && isNum(v.fscore) && isNum(v.fscore_av) && v.fscore_av >= 5 && v.fscore / v.fscore_av * 9 < R.fscore.varde) push('fscore', 'F-score ' + v.fscore + ' av ' + v.fscore_av + ' – under ' + R.fscore.varde);
  if (on('kvartal') && isNum(v.vinst_kvartal_fallande) && v.vinst_kvartal_fallande >= R.kvartal.varde) push('kvartal', 'Vinsten har fallit ' + v.vinst_kvartal_fallande + ' kvartal i rad mot året före');
  else if (on('kvartal') && isNum(v.vinst_kvartal_fallande) && v.vinst_kvartal_fallande >= 1 && v.vinst_ttm_fallande === true) push('kvartal', 'Fallande vinst: senaste kvartalet under fjolårets' + (isNum(v.vinst_kvartal_yoy) ? ' (' + fmtSigned(v.vinst_kvartal_yoy, 0) + ' %)' : '') + ' och senaste tolv månaderna under senaste bokslutsåret' + (isNum(v.vinst_ttm_fy) ? ' (' + fmtSigned(v.vinst_ttm_fy, 0) + ' %)' : ''));
  if (on('utd_sankt') && v.utd_sankt === true) push('utd_sankt', 'Utdelningen sänktes senaste året');
  if (on('ma200') && isNum(v.ma200) && v.ma200 > 0 && s.kurs > 0 && (s.kurs / v.ma200 - 1) * 100 < -R.ma200.varde) push('ma200', 'Kursen ligger ' + fmt(Math.abs((s.kurs / v.ma200 - 1) * 100), 1) + ' % under 200-dagars medelvärde');
  if (on('pe_p90') && isNum(v.pe_percentil) && v.pe_percentil >= R.pe_p90.varde) push('pe_p90', 'P/E i ' + fmt(v.pe_percentil, 0) + ':e percentilen av egen 5-årshistorik');
  const sviktar = !o.gateOk || fundamentaTraff.length > 0;
  // Ägda innehav: stop-loss, glidande stop, vikter, egen säljplan
  let hogsta = null;
  if (o.owned) {
    const utv = metricValue(s, 'utv_gav', ctx);
    if (on('stop_gav') && isNum(utv) && utv <= -R.stop_gav.varde) push('stop_gav', 'Stop-loss: ' + fmtPct(utv, 1, true) + ' mot GAV (gräns −' + fmt(R.stop_gav.varde, 0) + ' %)');
    hogsta = hogstaSedanKop(s);
    if (on('stop_topp') && hogsta && isNum(hogsta.fran) && hogsta.fran <= -R.stop_topp.varde && hogsta.hogst > (s.gav || 0)) push('stop_topp', 'Glidande stop: ' + fmtPct(hogsta.fran, 1, true) + ' från högsta ' + fmt(hogsta.hogst, 2) + ' (' + hogsta.basis + ')');
    const vikt = metricValue(s, 'vikt', ctx);
    if (on('max_vikt') && isNum(vikt) && vikt > R.max_vikt.varde) push('max_vikt', 'Portföljvikt ' + fmt(vikt, 1) + ' % – över ' + fmt(R.max_vikt.varde, 0) + ' %');
    const c = s.valuta || 'SEK', cv = ctx.valuta && ctx.valuta[c], andel = cv && ctx.total > 0 ? cv / ctx.total * 100 : null;
    if (on('max_valuta') && isNum(andel) && andel > R.max_valuta.varde) {
      const storst = ctx.storst && ctx.storst[c] && ctx.storst[c].id === s.id;
      if (storst) push('max_valuta', 'Valutan ' + c + ' är ' + fmt(andel, 0) + ' % av portföljen – över ' + fmt(R.max_valuta.varde, 0) + ' % (största innehavet)');
      else push('max_valuta', 'Valutan ' + c + ' är ' + fmt(andel, 0) + ' % av portföljen – över ' + fmt(R.max_valuta.varde, 0) + ' %', { niva: null, atgard: 'varna', atgardText: 'varning (rådet läggs på det största innehavet)' });
    }
    if (on('malkurs') && s.malkurs > 0 && s.kurs >= s.malkurs) push('malkurs', 'Målkursen ' + fmt(s.malkurs, 2) + ' är nådd (' + fmt(s.kurs, 2) + ')');
    if (on('stoppkurs') && s.stoppkurs > 0 && s.kurs > 0 && s.kurs <= s.stoppkurs) push('stoppkurs', 'Stoppkursen ' + fmt(s.stoppkurs, 2) + ' är nådd (' + fmt(s.kurs, 2) + ')');
  }
  // Villkorade stoppar: Sälj när fundamenta sviktar, annars högst Behåll.
  traffar.forEach(t => { if (t.atgard === 'villkorad') { t.niva = sviktar ? 0 : 2; t.atgardText = sviktar ? 'Sälj – fundamenta sviktar' : 'högst Behåll – kvalitet och styrka håller, öka inte'; } });
  // Två eller fler fundamenta-signaler samtidigt = Sälj.
  if (fundamentaTraff.length >= 2) traffar.push({ id: 'fundamenta', namn: 'Flera fundamenta-signaler', text: fundamentaTraff.length + ' fundamenta-signaler samtidigt', atgard: 'salj', atgardText: 'Sälj', niva: 0 });
  traffar.sort((p, q) => (p.niva == null ? 9 : p.niva) - (q.niva == null ? 9 : q.niva)); // allvarligast först
  return { traffar, sviktar, hogsta, fundamenta: fundamentaTraff.length };
}
function evalAll() { const ctx = ctxFor(state.stocks); return state.stocks.map(s => ({ stock: s, ev: evaluate(s, ctx), b: bedom(s, ctx), ctx })); }
function allSignals() {
  const out = [];
  evalAll().forEach(x => x.ev.triggered.forEach(row => out.push({ stock: x.stock, row })));
  out.sort((a, b) => (b.row.rule.vikt - a.row.rule.vikt) || a.stock.ticker.localeCompare(b.stock.ticker, 'sv'));
  return out;
}
function ruleTitle(r) { const d = metricById(r.metric); return (d ? d.namn : 'Okänt nyckeltal') + ' ' + r.op + ' ' + fmtVal(r.value, d); }
function signalText(x) {

  return d.namn + ' ' + fmtVal(x.value, d) + ' · regel: ' + OPW[r.op] + ' ' + fmtVal(r.value, d);
}

/* ---------- Beslutslogg (facit) ---------- */
// En rad per aktie och dag: kurs, beslut och poäng vid dagens senaste beräkning. Gamla rader ändras aldrig,
// så loggen visar vad appen faktiskt sa – även om reglerna ändras senare.
function loggaBeslut() {
  const d = todayISO(), ctx = ctxFor(state.stocks);
  let changed = false;
  state.stocks.forEach(s => {
    if (!(s.kurs > 0)) return;
    const b = bedom(s, ctx);
    if (b.verdict === 'saknas') return; // inget beslut utan analysunderlag – skriv inte över dagens rad med "saknas"
    const e = { d, id: s.id, sym: s.symbol || '', t: s.ticker, k: s.kurs, fx: s.fxSek || 1, v: b.verdict, p: b.score };
    // Etapp 5: dimensionspoäng, uppfyllda egna regler och riskregler som sänkte beslutet – för träffsäkerhet per dimension och regel.
    if (b.score != null) { e.dm = b.dims.map(x => x.poang == null ? null : Math.round(x.poang * 10) / 10); }
    const r = b.ev.rows.filter(x => x.status === 'uppfylld').map(x => x.rule.id); if (r.length) e.r = r;
    const rk = b.risk.traffar.filter(t => t.niva != null && b.modellNiva != null && t.niva < b.modellNiva).map(t => t.id); if (rk.length) e.rk = rk;
    const i = state.logg.findIndex(x => x.d === d && x.id === s.id);
    if (i >= 0) { if (JSON.stringify(state.logg[i]) !== JSON.stringify(e)) { state.logg[i] = e; changed = true; } }
    else { state.logg.push(e); changed = true; }
  });
  if (state.logg.length > 8000) state.logg = state.logg.slice(-8000);
  return changed;
}
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function histPriceAt(sym, iso) { const h = state.hist[sym]; if (!h || !Array.isArray(h.priser)) return null; for (let i = 0; i < h.priser.length; i++) { if (h.priser[i][0] >= iso) return h.priser[i][1]; } return null; }
function utfall(e, dagar) { const mal = addDays(e.d, dagar); if (mal > todayISO() || !e.sym) return null; const c = histPriceAt(e.sym, mal); return isNum(c) && e.k > 0 ? c / e.k - 1 : null; }
function utfallNu(e) {
  const s = stockById(e.id);
  let k = s && s.kurs > 0 ? s.kurs : null;
  if (k == null) { const last = state.logg.filter(x => x.id === e.id).sort((a, b) => a.d.localeCompare(b.d)).pop(); k = last ? last.k : null; }
  return isNum(k) && e.k > 0 ? k / e.k - 1 : null;
}
// Händelser = när beslutet för en aktie ändras (eller första gången den loggas).
function facitEvents() {
  const byStock = {};
  state.logg.slice().sort((a, b) => a.d.localeCompare(b.d)).forEach(e => { (byStock[e.id] = byStock[e.id] || []).push(e); });
  const events = [];
  Object.keys(byStock).forEach(id => { let prev = null; byStock[id].forEach(e => { if (!prev || prev.v !== e.v) events.push(Object.assign({ fran: prev ? prev.v : null }, e)); prev = e; }); });
  events.sort((a, b) => b.d.localeCompare(a.d) || a.t.localeCompare(b.t, 'sv'));
  return events;
}
let histLoading = false;
function ensureHistory(events) {
  if (histLoading || !state.online) return;
  const today = todayISO();
  const need = {};
  events.forEach(e => { if (!e.sym || addDays(e.d, 7) > today) return; const h = state.hist[e.sym]; if (!h || !h.hamtad || Date.now() - Date.parse(h.hamtad) > 20 * 3600 * 1000) need[e.sym] = Math.min(need[e.sym] || 1e9, daysSince(e.d) || 0); });
  const syms = Object.keys(need);
  if (!syms.length) return;
  histLoading = true;
  (async () => {
    for (const sym of syms) {
      const age = need[sym];
      const range = age > 700 ? '5y' : age > 330 ? '2y' : '1y';
      try { const h = await api('/historik', { symbol: sym, range }); if (h && Array.isArray(h.priser)) { state.hist[sym] = { hamtad: new Date().toISOString(), valuta: h.valuta || null, priser: h.priser }; } }
      catch (e) { state.hist[sym] = state.hist[sym] || { hamtad: new Date().toISOString(), priser: [] }; }
    }
    store.saveHist();
    histLoading = false;
    if (state.view === 'facit') render();
  })();
}

/* ---------- Kompassen ---------- */
// Kompassen: poäng 0–100 på en halvcirkel. Röd zon under Minska-gränsen, grön från Köp-gränsen, grå däremellan.
function gaugeSVG(score, extra) {
  const t = state.settings.modell.troskel;
  const pt = (sc, r) => { const a = (180 - sc * 1.8) * Math.PI / 180; return [50 + r * Math.cos(a), 52 - r * Math.sin(a)]; };
  const arc = (s0, s1, klass) => {
    if (s1 <= s0) return '';
    const p0 = pt(s0, 42), p1 = pt(s1, 42);
    return '<path class="z ' + klass + '" fill="none" d="M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A42 42 0 0 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + '"/>';
  };
  const s = score == null ? 50 : Math.max(0, Math.min(100, score));
  const n = pt(s, 33);
  return '<svg class="gauge ' + (score == null ? 'none ' : '') + (extra || '') + '" viewBox="0 0 100 58" aria-hidden="true">' +
    arc(0, t.minska, 'z-salj') + arc(t.minska, t.behall, 'z-minska') + arc(t.behall, t.kop, 'z-behall') + arc(t.kop, 100, 'z-kop') +
    '<line class="needle" x1="50" y1="52" x2="' + n[0].toFixed(2) + '" y2="' + n[1].toFixed(2) + '"/><circle class="pivot" cx="50" cy="52" r="3.2"/></svg>';
}
// Sex små staplar, en per dimension (0–5). Tom stapel = går inte att bedöma.
function dimsHTML(dims, extra) {
  return '<span class="dims ' + (extra || '') + '" aria-hidden="true">' + dims.map(d => {
    const p = d.poang;
    const lvl = p == null ? 'na' : p >= 3.5 ? 'hi' : p < 2 ? 'lo' : 'mid';
    return '<i class="' + lvl + '" style="--h:' + (p == null ? 100 : Math.max(8, p / 5 * 100)) + '%" title="' + esc(d.namn + ': ' + (p == null ? 'saknas' : fmt(p, 1) + ' av 5')) + '"></i>';
  }).join('') + '</span>';
}

// Chip för utlöst riskregel (sälj/minska/högst behåll): den som sänkte beslutet, annars den allvarligaste utlösta (markerad som varning). Rena varningsregler ger ingen chip.
function riskChip(b) {
  if (!b.risk || !b.risk.traffar.length) return '';
  const sankte = b.modellNiva != null && b.niva < b.modellNiva ? b.risk.traffar.find(t => t.niva === b.niva) : null;
  const hit = sankte || b.risk.traffar.find(t => t.niva != null);
  if (!hit) return '';
  const def = RISK_BY_ID[hit.id] || { kort: hit.id === 'fundamenta' ? 'Fundamenta' : 'Risk' };
  return '<span class="chip sm risk' + (sankte ? '' : ' varn') + '" title="' + (sankte ? 'Riskregel sänkte beslutet' : 'Riskregel utlöst – ändrar inte beslutet') + '">' + esc(def.kort) + '</span>';

/* ---------- "Är det ett bra köp?" – rimlig värdering, jämförbara bolag, analytiker, bokslut ---------- */
// Enkel tvåstegs-DCF på fritt kassaflöde per aktie: g1 i fem år, därefter linjär avtrappning till evig tillväxt under fem år, sedan evig tillväxt.
const DCF = { ar1: 5, ar2: 5, evig: 3 };
function dcfVarde(fcf, g1, krav, evig) {
  evig = evig == null ? DCF.evig : evig;
  if (!(fcf > 0) || !(krav > evig)) return null;
  let v = 0, c = fcf, g = g1;
  for (let t = 1; t <= DCF.ar1 + DCF.ar2; t++) {
    if (t > DCF.ar1) g = g1 + (evig - g1) * (t - DCF.ar1) / DCF.ar2;
    c = c * (1 + g / 100);
    v += c / Math.pow(1 + krav / 100, t);
  }
  const tv = c * (1 + evig / 100) / ((krav - evig) / 100);
  return v + tv / Math.pow(1 + krav / 100, DCF.ar1 + DCF.ar2);
}
// Baklänges: vilken tillväxt g1 får dagens kurs att gå ihop vid avkastningskravet?
function dcfKravdTillvaxt(fcf, kurs, krav) {
  if (!(fcf > 0) || !(kurs > 0)) return null;
  let lo = -30, hi = 80;
  if (dcfVarde(fcf, hi, krav) < kurs) return hi + 1; // mer än 80 % – orimligt
  if (dcfVarde(fcf, lo, krav) > kurs) return lo - 1;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (dcfVarde(fcf, mid, krav) < kurs) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function fmtBelopp(v, valuta) {
  if (!isNum(v)) return '–';
  const a = Math.abs(v);
  const txt = a >= 1e9 ? fmt(v / 1e9, a >= 1e10 ? 0 : 1) + ' mdr' : a >= 1e6 ? fmt(v / 1e6, 0) + ' mn' : fmt(v, 0);
  return txt + (valuta ? ' ' + valuta : '');
}
// Rimlig värdering för en aktie. Returnerar metoder (med värde i kursvalutan och förbehåll), antaganden och slutsats.
function rimligVardering(s, b) {
  const a = b.a; if (!a) return null;
  const v = analysVarden(s, a), kurs = s.kurs > 0 ? s.kurs : a.kurs;
  if (!(kurs > 0)) return null;
  const opal = a.opalitlig && a.opalitlig.indexOf('vinst') >= 0;
  const vpa = !opal && isNum(v.vpa) && v.vpa > 0 ? v.vpa : null;
  const vpaF = isNum(v.vpa_forward) && v.vpa_forward > 0 ? v.vpa_forward : null;
  const fcf = isNum(v.fcf_yield) ? kurs * v.fcf_yield / 100 : null;
  // Tillväxtantagande: analytikernas prognos nästa år, annars historisk vinsttillväxt, annars omsättningstillväxt.
  let g = null, gKalla = '';
  if (isNum(v.prognos_vinst_nasta_ar)) { g = v.prognos_vinst_nasta_ar; gKalla = 'analytikernas vinstprognos nästa år'; }
  else if (!opal && isNum(v.vpa_cagr3)) { g = v.vpa_cagr3; gKalla = 'vinsttillväxt per aktie senaste tre åren'; }
  else if (isNum(v.oms_cagr3)) { g = v.oms_cagr3; gKalla = 'omsättningstillväxt senaste tre åren'; }
  const gDcf = g == null ? 3 : Math.max(-10, Math.min(25, g)); // DCF: max 25 % i fem år
  const metoder = [];
  // Graham
  if (!opal && isNum(v.graham) && v.graham > 0) metoder.push({ id: 'graham', namn: 'Graham-tal', varde: v.graham, vikt: g != null && g > 15 ? 0.5 : 1, text: '√(22,5 × VPA ' + fmt(vpa, 2) + ' × eget kapital/aktie). Försiktigt värde för mogna bolag; undervärderar tillväxtbolag.' });
  // PEG-baserat rimligt P/E (Lynch: P/E ≈ tillväxt)
  if (g != null && (vpa || vpaF)) {
    const fairPe = Math.max(8, Math.min(35, g));
    const bas = vpa || vpaF;
    metoder.push({ id: 'peg', namn: 'PEG-baserat rimligt P/E', varde: fairPe * bas, vikt: 1, text: 'Rimligt P/E ' + fmt(fairPe, 0) + ' (= förväntad tillväxt ' + fmt(g, 0) + ' %, begränsat till 8–35) × ' + (vpa ? 'VPA ' + fmt(vpa, 2) : 'VPA framåt ' + fmt(vpaF, 2)) + '. Lynch.' });
  }
  // DCF 9–10 %
  if (fcf != null && fcf > 0) {
    const v10 = dcfVarde(fcf, gDcf, 10), v9 = dcfVarde(fcf, gDcf, 9);
    metoder.push({ id: 'dcf', namn: 'Diskonterat kassaflöde (DCF)', varde: (v9 + v10) / 2, lag: v10, hog: v9, vikt: 2, text: 'Fritt kassaflöde ' + fmt(fcf, 2) + ' per aktie växer ' + fmt(gDcf, 0) + ' % per år i fem år' + (g != null && g > 25 ? ' (prognosen ' + fmt(g, 0) + ' % är nedtagen till 25 %)' : '') + ', trappas ned till ' + DCF.evig + ' % evig tillväxt, avkastningskrav 9–10 %.' });
    const krav = dcfKravdTillvaxt(fcf, kurs, 9.5);
    metoder.push({ id: 'baklanges', namn: 'Baklängesräkning', varde: null, kravdTillvaxt: krav, text: krav == null ? '' : krav > 80 ? 'Dagens kurs kräver mer än 80 % årlig tillväxt i fritt kassaflöde i fem år (vid 9,5 % avkastningskrav) – kursen bygger på något annat än dagens kassaflöde.' : krav < -30 ? 'Dagens kurs är motiverad även om kassaflödet krymper kraftigt.' : 'Dagens kurs kräver ' + fmt(krav, 0) + ' % årlig tillväxt i fritt kassaflöde de kommande fem åren (vid 9,5 % avkastningskrav)' + (g != null ? ' – prognosen säger ' + fmt(g, 0) + ' %.' : '.') });
  } else if (fcf != null) metoder.push({ id: 'dcf', namn: 'Diskonterat kassaflöde (DCF)', varde: null, vikt: 0, text: 'Går inte att räkna: fritt kassaflöde är negativt.' });
  // Analytikernas riktkurs
  if (a.analytiker && isNum(a.analytiker.riktkurs) && a.analytiker.riktkurs > 0) metoder.push({ id: 'rikt', namn: 'Analytikernas riktkurs', varde: a.analytiker.riktkurs, lag: a.analytiker.riktkursLag, hog: a.analytiker.riktkursHog, vikt: 1, text: (a.analytiker.antal || '?') + ' analytiker, spann ' + fmt(a.analytiker.riktkursLag, 0) + '–' + fmt(a.analytiker.riktkursHog, 0) + '. Tenderar att följa kursen.' });
  const med = metoder.filter(m => isNum(m.varde) && m.varde > 0 && m.vikt > 0);
  let rimligt = null;
  if (med.length) { const w = med.reduce((n, m) => n + m.vikt, 0); rimligt = Math.exp(med.reduce((n, m) => n + Math.log(m.varde) * m.vikt, 0) / w); } // viktat geometriskt snitt
  const spridning = med.length >= 2 ? Math.max(...med.map(m => m.varde)) / Math.min(...med.map(m => m.varde)) : null;
  return { metoder, rimligt, kopvard: rimligt != null ? rimligt * 0.8 : null, fullvarderad: rimligt != null ? rimligt * 1.2 : null, kurs, g, gKalla, gDcf, fcf, vpa, vpaF, spridning, antal: med.length, opal };
}
function renderAnalyssida(s, b) {
  const a = b.a;
  const cur = s.valuta && s.valuta !== 'SEK' ? s.valuta : 'kr';
  if (!a) return '<section class="card analys-sida"><h2>Är det ett bra köp?</h2><p class="hint">' + (s.symbol ? 'Analysen hämtas vid nästa uppdatering.' : 'Koppla aktien till en Yahoo-symbol så kan appen räkna på värdering, jämförbara bolag och analytikernas bild.') + '</p></section>';
  const rv = rimligVardering(s, b);
  const v = analysVarden(s, a);
  const kr = n => fmt(n, n != null && n < 10 ? 2 : n < 100 ? 1 : 0) + ' ' + cur;
  // Värdering
  let vard = '';
  if (rv && rv.rimligt != null) {
    const avvik = (rv.kurs / rv.rimligt - 1) * 100;
    const lage = rv.kurs < rv.kopvard ? 'köpvärd' : rv.kurs > rv.fullvarderad ? 'fullvärderad' : 'rimligt värderad';
    vard = '<div class="rv-sammanfattning ' + (lage === 'köpvärd' ? 'hi' : lage === 'fullvärderad' ? 'lo' : 'mid') + '">' +
        '<div class="rv-slutsats"><b>Köpvärd under ' + kr(rv.kopvard) + ', fullvärderad över ' + kr(rv.fullvarderad) + '.</b> Kursen ' + kr(rv.kurs) + ' ligger ' + fmtPct(Math.abs(avvik), 0) + ' ' + (avvik < 0 ? 'under' : 'över') + ' det rimliga värdet ' + kr(rv.rimligt) + ' → <b>' + lage + '</b>.</div>' +
        '<div class="rv-skala"><span class="rv-m" style="left:' + Math.max(2, Math.min(98, 50 + Math.max(-45, Math.min(45, avvik)))) + '%" title="kursen"></span><i class="rv-zon kop" style="left:0;width:40%"></i><i class="rv-zon neutral" style="left:40%;width:20%"></i><i class="rv-zon salj" style="left:60%;width:40%"></i></div>' +
        '<div class="rv-skalatext small muted"><span>köpvärd</span><span>rimligt ' + kr(rv.rimligt) + '</span><span>fullvärderad</span></div>' +
      '</div>' +
      '<ul class="rv-metoder">' + rv.metoder.map(m => '<li><div class="rvm-head"><span class="rvm-namn">' + esc(m.namn) + '</span><span class="num rvm-varde">' + (isNum(m.varde) ? kr(m.varde) + (isNum(m.lag) && isNum(m.hog) ? ' <span class="muted small">(' + fmt(m.lag, 0) + '–' + fmt(m.hog, 0) + ')</span>' : '') : (m.id === 'baklanges' ? '' : '–')) + '</span></div><div class="hint">' + esc(m.text) + '</div></li>').join('') + '</ul>' +
      '<p class="hint">Rimligt värde = viktat snitt av metoderna (DCF väger dubbelt' + (rv.g != null && rv.g > 15 ? ', Graham-talet halvt för tillväxtbolag' : '') + '); köpvärd = 20 % säkerhetsmarginal under, fullvärderad = 20 % över. ' + (rv.spridning != null && rv.spridning > 2.5 ? '<b>Metoderna spretar kraftigt (' + fmt(rv.spridning, 1) + ' gånger mellan lägsta och högsta) – ta intervallet med en nypa salt.</b> ' : '') +
        'Antaganden: tillväxt ' + (rv.g != null ? fmt(rv.g, 0) + ' % (' + esc(rv.gKalla) + ')' : 'saknas – 3 % används') + ', avkastningskrav 9–10 %, evig tillväxt 3 %' + (rv.fcf != null ? ', fritt kassaflöde ' + fmt(rv.fcf, 2) + ' ' + cur + '/aktie' : '') + '. Förenklade modeller på Yahoo-data – ett intervall att resonera kring, inte ett facit.</p>';
  } else {
    vard = '<p class="hint">Ingen värderingsmetod går att räkna' + (rv && rv.opal ? ' – vinsten i källan är orimlig' : '') + (rv && rv.metoder.length ? ': ' + esc(rv.metoder.map(m => m.namn + (m.text ? ' (' + m.text + ')' : '')).join('; ')) : '') + '.</p>';
  }
  // Styrkor och svagheter
  const li = (z, klass) => '<li class="' + klass + '"><span class="mark">' + (klass === 'for' ? '+' : '−') + '</span><span class="rc-text">' + esc(z.text) + (z.sub ? '<span class="sub">' + esc(z.sub) + '</span>' : '') + '</span></li>';
  const styrkor = '<div class="skal"><div><h3>Styrkor</h3>' + (b.skalFor.length ? '<ul class="skal-list">' + b.skalFor.slice(0, 5).map(z => li(z, 'for')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div>' +
    '<div><h3>Svagheter</h3>' + (b.skalEmot.length ? '<ul class="skal-list">' + b.skalEmot.slice(0, 5).map(z => li(z, 'emot')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div></div>';
  // Jämförbara bolag
  let jamfor = '';
  if (a.jamfor && a.jamfor.bolag && a.jamfor.bolag.length) {
    const rad = (sym, namn, pe, fpe, pb, avk, rek, egen) => '<tr' + (egen ? ' class="egen"' : '') + '><td><b>' + esc(sym) + '</b><div class="small muted">' + esc(namn) + '</div></td><td class="num r">' + (isNum(pe) ? fmt(pe, 1) : '–') + '</td><td class="num r">' + (isNum(fpe) ? fmt(fpe, 1) : '–') + '</td><td class="num r">' + (isNum(pb) ? fmt(pb, 1) : '–') + '</td><td class="num r ' + cls(avk) + '">' + (isNum(avk) ? fmtSigned(avk, 0) + ' %' : '–') + '</td><td class="small">' + esc(rek || '–') + '</td></tr>';
    jamfor = '<h3>Jämförbara bolag</h3><div class="table-scroll"><table class="jamfor"><thead><tr><th>Bolag</th><th class="r">P/E</th><th class="r">P/E fram.</th><th class="r">P/B</th><th class="r">52 v</th><th>Rek.</th></tr></thead><tbody>' +
      rad(s.ticker, a.namn, v.pe, v.pe_forward, v.pb, v.avk12m, a.analytiker && a.analytiker.rek ? { strong_buy: 'Stark köp', buy: 'Köp', hold: 'Behåll', underperform: 'Sälj', sell: 'Sälj' }[a.analytiker.rek] || a.analytiker.rek : null, true) +
      a.jamfor.bolag.map(x => rad(x.symbol, x.namn, x.pe, x.fpe, x.pb, x.avk52v, x.rek ? String(x.rek).replace(/^\d+(\.\d+)? - /, '') : null, false)).join('') +
      '<tr class="median"><td>Median liknande</td><td class="num r">' + (isNum(a.jamfor.peMedian) ? fmt(a.jamfor.peMedian, 1) : '–') + '</td><td class="num r">' + (isNum(a.jamfor.fpeMedian) ? fmt(a.jamfor.fpeMedian, 1) : '–') + '</td><td class="num r">' + (isNum(a.jamfor.pbMedian) ? fmt(a.jamfor.pbMedian, 1) : '–') + '</td><td class="num r">' + (isNum(a.jamfor.avk52vMedian) ? fmtSigned(a.jamfor.avk52vMedian, 0) + ' %' : '–') + '</td><td></td></tr>' +
      '</tbody></table></div><p class="hint">"Liknande bolag" enligt Yahoo – listan bygger delvis på vad andra tittar på, inte strikt bransch. Bedöm själv om jämförelsen är rättvis.</p>';
  }
  // Analytikernas bild
  const an = a.analytiker || {};
  const rekText = isNum(an.snitt) ? (an.snitt <= 1.5 ? 'Stark köp' : an.snitt <= 2.5 ? 'Köp' : an.snitt <= 3.5 ? 'Behåll' : an.snitt <= 4.5 ? 'Sälj' : 'Stark sälj') + ' (' + fmt(an.snitt, 1) + ' av 5)' : '–';
  const analytiker = an.antal || isNum(an.riktkurs)
    ? '<h3>Analytikernas bild</h3><dl class="facts an-kv">' +
      '<div><dt>Antal</dt><dd class="num">' + (an.antal || '–') + '</dd></div><div><dt>Snittrekommendation</dt><dd>' + esc(rekText) + '</dd></div>' +
      '<div><dt>Andel köp</dt><dd class="num">' + (isNum(an.andelKop) ? fmt(an.andelKop, 0) + ' %' : '–') + (isNum(an.andelKop3mSedan) ? ' <span class="muted small">(' + fmt(an.andelKop3mSedan, 0) + ' % för 3 mån sedan)</span>' : '') + '</dd></div>' +
      '<div><dt>Riktkurs</dt><dd class="num">' + (isNum(an.riktkurs) ? kr(an.riktkurs) + ' <span class="muted small">(' + fmt(an.riktkursLag, 0) + '–' + fmt(an.riktkursHog, 0) + ')</span>' : '–') + '</dd></div>' +
      '<div><dt>Vinstprognos i år / nästa år</dt><dd class="num">' + fmtPct(an.prognos && an.prognos.vinstIAr, 0, true) + ' / ' + fmtPct(an.prognos && an.prognos.vinstNastaAr, 0, true) + '</dd></div>' +
      '<div><dt>Omsättning nästa år</dt><dd class="num">' + fmtPct(an.prognos && an.prognos.omsattningNastaAr, 0, true) + '</dd></div>' +
      '<div><dt>Revideringar 30 d / estimat 90 d</dt><dd class="num">' + (an.revideringar ? (an.revideringar.upp30 + ' upp, ' + an.revideringar.ner30 + ' ned / ' + fmtPct(an.revideringar.estimat90d, 1, true)) : '–') + '</dd></div>' +
      '<div><dt>Överraskningar</dt><dd class="num">' + (an.overraskning && an.overraskning.av ? an.overraskning.slagna + ' av ' + an.overraskning.av + ' slog estimaten, snitt ' + fmtPct(an.overraskning.snitt, 1, true) : '–') + '</dd></div>' +
      '<div><dt>' + (an.nastaRapport ? 'Nästa rapport' : 'Senaste rapport') + '</dt><dd>' + esc(fmtDate(an.nastaRapport || an.senasteRapport)) + '</dd></div>' +
    '</dl>' : '<h3>Analytikernas bild</h3><p class="hint">Inga analytikerdata hos Yahoo för den här aktien.</p>';
  // Bokslut
  const fc = a.redovisningsvaluta || '';
  const bok = a.bokslut && a.bokslut.length ? '<h3>Bokslut (' + esc(fc) + ')</h3><div class="table-scroll"><table class="bokslut"><thead><tr><th>År</th><th class="r">Omsättning</th><th class="r">Vinst</th><th class="r">Fritt kassaflöde</th><th class="r">Marginal</th><th class="r">VPA</th><th class="r">Aktier</th></tr></thead><tbody>' +
    a.bokslut.map(r => '<tr><td>' + esc(r.ar) + '</td><td class="num r">' + fmtBelopp(r.omsattning) + '</td><td class="num r ' + cls(r.vinst) + '">' + fmtBelopp(r.vinst) + '</td><td class="num r ' + cls(r.frittKassaflode) + '">' + fmtBelopp(r.frittKassaflode) + '</td><td class="num r">' + (isNum(r.vinst) && r.omsattning > 0 ? fmt(r.vinst / r.omsattning * 100, 1) + ' %' : '–') + '</td><td class="num r">' + (isNum(r.vpa) ? fmt(r.vpa, 2) : '–') + '</td><td class="num r">' + fmtBelopp(r.aktier) + '</td></tr>').join('') +
    '</tbody></table></div>' + (a.kvartal && a.kvartal.length ? '<p class="hint">Senaste kvartalsvinster: ' + a.kvartal.map(q => esc(q.datum.slice(0, 7)) + ' ' + fmtBelopp(q.vinst)).join(' · ') + (isNum(v.vinst_kvartal_yoy) ? ' · senaste kvartalet ' + fmtPct(v.vinst_kvartal_yoy, 0, true) + ' mot samma kvartal i fjol' : '') + '</p>' : '') : '';
  // Utdelningshistorik
  const uh = a.utdelning && a.utdelning.historik && a.utdelning.historik.length ? a.utdelning.historik : [];
  const utd = uh.length ? '<h3>Utdelning per år (' + esc(cur) + ')</h3><div class="utd-bars">' + (() => { const mx = Math.max(...uh.map(x => x[1])) || 1; return uh.map(x => '<div class="ub"><i style="--h:' + (x[1] / mx * 100) + '%"></i><span class="num">' + fmt(x[1], x[1] < 1 ? 2 : 1) + '</span><span class="muted">' + esc(x[0]) + '</span></div>').join(''); })() + '</div>' +
    '<p class="hint">' + (isNum(a.utdelning.direktavkastning) ? 'Direktavkastning ' + fmt(a.utdelning.direktavkastning, 2) + ' %' + (isNum(a.utdelning.direktavkastning5ar) ? ' (5-årssnitt ' + fmt(a.utdelning.direktavkastning5ar, 2) + ' %)' : '') + ' · ' : '') + (isNum(a.utdelning.andelAvVinst) ? 'utdelningsandel ' + fmt(a.utdelning.andelAvVinst, 0) + ' % · ' : '') + (isNum(a.utdelning.arUtanSankning) ? a.utdelning.arUtanSankning + ' år utan sänkning · ' : '') + (a.utdelning.xdag ? 'X-dag ' + esc(fmtDate(a.utdelning.xdag)) : '') + '</p>' : '';
  return '<section class="card analys-sida"><div class="card-head"><h2>Är det ett bra köp?</h2><span class="hint">' + (b.score != null ? esc(verdictLabel(b.verdict, s.antal > 0)) + ' · ' + b.score + ' p' : '') + '</span></div>' +
    '<h3>Rimlig värdering</h3>' + vard +
    styrkor + jamfor + analytiker + bok + utd +
    '<p class="hint">Underlag: Yahoo Finance, analys hämtad ' + esc(fmtTime(b.hamtad)) + '. Beslutsstöd, inte finansiell rådgivning – siffror från källan kan vara fel eller gamla, kontrollera mot bolagets rapporter innan du handlar.</p>' +
  '</section>';
}

// Påminnelse på portföljsidan: ägda aktier vars beslut ändrats de senaste 7 dagarna – läs tesen och säljplanen.
function paminnelseNotis(evals) {
  const events = facitEvents();
  const nyl = [];
  evals.forEach(x => { if (!(x.stock.antal > 0)) return; const e = events.find(ev => ev.id === x.stock.id && ev.fran); if (e && daysSince(e.d) <= 7 && e.v === x.b.verdict) nyl.push({ s: x.stock, e }); });
  if (!nyl.length) return '';
  return '<div class="notice paminnelse-notis"><span><b>Ändrade beslut:</b> ' + nyl.slice(0, 5).map(z => '<button class="btn link small" data-action="open-stock" data-id="' + esc(z.s.id) + '">' + esc(z.s.ticker) + ' ' + esc(verdictLabel(z.e.fran, true)) + ' → ' + esc(verdictLabel(z.e.v, true)) + '</button>').join(', ') + (nyl.length > 5 ? ' m.fl.' : '') + '. Läs din tes och säljplan innan du gör något.</span></div>';
}
// Bedömningskortet på aktiens sida: kompass, beslut, skäl för och emot, de sex dimensionerna med kriterier, flaggor och dina regler.
function renderBedomning(s, b, ctx, checkRows) {
  const owned = s.antal > 0, m = state.settings.modell;
  const stilNamn = STILAR[m.stil] ? STILAR[m.stil].namn : 'Egen stil';
  const li = (z, klass) => '<li class="' + klass + '"><span class="mark">' + (klass === 'for' ? '+' : '−') + '</span><span class="rc-text">' + esc(z.text) + (z.sub ? '<span class="sub">' + esc(z.sub) + '</span>' : '') + '</span></li>';
  const skal = (b.skalFor.length || b.skalEmot.length)
    ? '<div class="skal"><div><h3>Talar för</h3>' + (b.skalFor.length ? '<ul class="skal-list">' + b.skalFor.slice(0, 3).map(z => li(z, 'for')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div>' +
      '<div><h3>Talar emot</h3>' + (b.skalEmot.length ? '<ul class="skal-list">' + b.skalEmot.slice(0, 3).map(z => li(z, 'emot')).join('') + '</ul>' : '<p class="hint">Inget som sticker ut.</p>') + '</div></div>'
    : '';
  const dimRows = b.dims.map(d => {
    const p = d.poang;
    const krit = d.kriterier.map(x => {
      const k = x.k, g = x.p == null ? '' : x.p >= 0.75 ? 'hi' : x.p <= 0.25 ? 'lo' : 'mid';
      return '<li class="krit ' + (x.p == null ? 'na' : g) + '"><span class="k-dot"></span><span class="k-text"><span class="k-name">' + esc(k.namn) + '</span> <span class="num k-val">' + (x.p == null ? '<span class="muted">saknas</span>' : esc(kritText(k, x.v).slice(k.namn.length + 1))) + '</span>' +
        '<span class="k-sub">' + esc(kritGransText(k)) + ' · ' + esc(k.kalla) + '</span></span><span class="num k-p">' + (x.p == null ? '' : fmt(x.p * 5, 1)) + '</span></li>';
    }).join('');
    const sub = d.ingen && p == null ? 'ingen utdelning – räknas inte i den här stilen' : d.ingen ? 'ingen utdelning' : p == null ? (d.antal ? 'för få kriterier går att räkna (' + d.antal + ' av ' + d.av + ')' : 'ingen data') : d.antal + ' av ' + d.av + ' kriterier · vikt ' + fmt(d.vikt, 2).replace(/,?0+$/, '');
    return '<details class="dim ' + dimClass(p) + (d.vikt === 0 ? ' off' : '') + '"><summary><span class="dim-name">' + esc(d.namn) + '</span><span class="dim-bar"><i style="--w:' + (p == null ? 0 : p / 5 * 100) + '%"></i></span><span class="dim-p num">' + (p == null ? '–' : fmt(p, 1)) + '</span><span class="dim-sub">' + esc(sub) + '</span></summary>' +
      (krit ? '<ul class="krit-list">' + krit + '</ul>' : '<p class="hint">Inga kriterier gäller för den här bolagstypen.</p>') + '</details>';
  }).join('');
  const typNamn = { bank: 'bank', forsakring: 'försäkringsbolag', finans: 'finansbolag', investment: 'investmentbolag', fastighet: 'fastighetsbolag' }[b.typ];
  const analysLine = s.symbol
    ? (b.a ? 'Analys hämtad ' + esc(fmtTime(b.hamtad)) + ' · Yahoo Finance' + (b.a.profil && b.a.profil.bransch ? ' · ' + esc(b.a.profil.bransch) : '') + (typNamn ? ' · bedöms som ' + typNamn : '') + (b.a.saknas && b.a.saknas.length ? ' · saknas: ' + esc(b.a.saknas.join(', ')) : '') + (analysVarden(s, b.a)._omraknad ? ' · kursbaserade mått omräknade till din kurs ' + fmt(s.kurs, 2) + ' (källans ' + fmt(b.a.kurs, 2) + ' från ' + esc(fmtDate(b.a.kursTid)) + ')' : '') + (b.a.opalitlig && b.a.opalitlig.indexOf('vinst') >= 0 ? ' · vinstbaserade kriterier hoppas över (orimlig vinst i källan)' : '')
      : (s.analysFel ? 'Analysen kunde inte hämtas: ' + esc(s.analysFel) : 'Analysen hämtas vid nästa uppdatering')) + ' · <button class="btn link small" data-action="refresh-analys"' + (refreshing ? ' disabled' : '') + '>Hämta analys igen</button>'
    : 'Ingen automatisk hämtning – bara dina egna regler kan bedömas. <button class="btn link small" data-action="edit-stock">Koppla till Yahoo-symbol</button>';
  const sparText = b.regelSkal.filter(z => z.typ === 'spar');
  // Riskkontroll: träffar, och om de sänkt beslutet.
  const sankt = b.modellNiva != null && b.niva != null && b.niva < b.modellNiva;
  const riskBox = b.risk.traffar.length
    ? '<div class="riskbox' + (sankt ? ' sankt' : '') + '"><h3>Riskkontroll</h3>' +
        (sankt ? '<p class="lead">Modellen säger <b>' + verdictLabel(b.modellVerdict, owned) + '</b>, riskreglerna sänker till <b>' + verdictLabel(b.verdict, owned) + '</b>.</p>' : '') +
        '<ul>' + b.risk.traffar.map(t => '<li><span class="chip sm ' + (t.niva === 0 ? 'salj' : t.niva === 1 ? 'salj' : t.niva === 2 ? 'behall' : 'bevaka') + '">' + esc(t.niva === 0 ? 'Sälj' : t.niva === 1 ? 'Minska' : t.niva === 2 ? 'Högst behåll' : 'Varning') + '</span> ' + esc(t.text) + '<span class="sub">' + esc(t.namn) + ' · ' + esc(t.atgardText) + '</span></li>').join('') + '</ul>' +
        (b.risk.traffar.some(t => t.atgard === 'villkorad') ? '<p class="hint">Stopparna är villkorade: ' + (b.risk.sviktar ? 'fundamenta sviktar (' + (b.risk.fundamenta ? b.risk.fundamenta + ' fundamenta-signal' + (b.risk.fundamenta > 1 ? 'er' : '') : 'kvalitet eller styrka under spärrnivån') + '), därför Sälj.' : 'kvalitet och styrka håller, därför högst Behåll – öka inte, och läs din tes och säljplan nedan.') + ' Ändra under Regler → Riskregler.</p>' : '') +
      '</div>'
    : '';
  // Påminnelse om tes och säljplan när beslutet nyligen ändrats.
  const senasteByte = facitEvents().find(e => e.id === s.id && e.fran);
  const nyligen = senasteByte && daysSince(senasteByte.d) <= 7;
  const paminnelse = owned && nyligen && (s.tes || s.saljplan)
    ? '<div class="paminnelse"><h3>Påminnelse</h3><p>Beslutet ändrades ' + esc(fmtDate(senasteByte.d)) + ' från <b>' + verdictLabel(senasteByte.fran, true) + '</b> till <b>' + verdictLabel(senasteByte.v, true) + '</b>. Stämmer din tes fortfarande?</p>' +
        (s.tes ? '<p><b>Tes:</b> ' + esc(s.tes) + '</p>' : '') + (s.saljplan ? '<p><b>Säljplan:</b> ' + esc(s.saljplan) + '</p>' : '') + '</div>'
    : (owned && nyligen && !s.tes && !s.saljplan ? '<div class="paminnelse"><h3>Påminnelse</h3><p>Beslutet ändrades ' + esc(fmtDate(senasteByte.d)) + ' från <b>' + verdictLabel(senasteByte.fran, true) + '</b> till <b>' + verdictLabel(senasteByte.v, true) + '</b>. Du har ingen tes eller säljplan för aktien – <button class="btn link small" data-action="edit-tes">skriv ner dem</button> så påminner appen om dem nästa gång.</p></div>' : '');
  return '<section class="card d-verdict">' +
      '<div class="gauge-wrap">' + gaugeSVG(b.score) + '<div class="verdict-label ' + verdictClass(b.verdict) + '">' + verdictLabel(b.verdict, owned) + '</div>' +
        '<div class="score num">' + (b.score == null ? 'Går inte att bedöma ännu' : 'Poäng ' + b.score + ' av 100 · ' + esc(stilNamn) + (b.justering ? ' · regler ' + fmtSigned(b.justering, 0) : '') + (sankt ? ' · modell: ' + verdictLabel(b.modellVerdict, owned) : '')) + '</div></div>' +
      '<div class="verdict-text">' +
        (b.score == null ? '<p class="lead">' + (s.symbol ? 'När analysen är hämtad bedöms aktien i sex dimensioner enligt etablerade kriterier.' : 'Koppla aktien till en Yahoo-symbol så hämtas allt modellen behöver.') + '</p>' : skal) +
        riskBox + paminnelse +
        (b.flaggor.length ? '<div class="flaggor"><h3>Röda flaggor</h3><ul>' + b.flaggor.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>' : '') +
      '</div>' +
      '<div class="dims-wrap">' + dimRows + '</div>' +
      (b.ev.rows.length ? '<div class="regler-wrap"><h3>Dina regler</h3>' + (sparText.length ? '<p class="hint spar">Köp-dippen-spärren håller tillbaka: ' + esc(sparText.map(z => z.text).join('; ')) + ' – kvalitet och styrka måste vara minst ' + fmt(m.sparNiva, 1) + ' av 5.</p>' : '') + '<ul class="rule-check">' + checkRows + '</ul></div>' : '') +
      '<p class="hint">' + analysLine + '</p>' +
    '</section>';
}

function renderSignals() {
  const evals = evalAll();
  const signals = allSignals();
  const kopN = signals.filter(x => x.row.rule.signal === 'kop').length, saljN = signals.length - kopN;
  const stale = state.stocks.filter(s => isStale(s) || s.fel);
  const order = { kop_mer: 0, kop: 0, salj: 1, minska: 2, undvik: 2, behall: 3, avvakta: 3, bevaka: 3, saknas: 4 };
  const byVerdict = evals.slice().sort((a, b) => (order[a.b.verdict] - order[b.b.verdict]) || ((b.b.score || 0) - (a.b.score || 0)) || a.stock.ticker.localeCompare(b.stock.ticker, 'sv'));

function indexFor(symbol) {

let idxLoading = false;
function ensureIndexHistory() {
  if (idxLoading || !state.online) return;

  state.logg.forEach(e => { if (!e.sym) return; const ix = indexFor(e.sym); const h = state.hist[ix]; if (!h || !h.hamtad || Date.now() - Date.parse(h.hamtad) > 20 * 3600 * 1000) need[ix] = Math.max(need[ix] || 0, daysSince(e.d) || 0); });
  const syms = Object.keys(need);

  idxLoading = true;
  (async () => {
    for (const sym of syms) {
      const age = need[sym], range = age > 700 ? '5y' : age > 330 ? '2y' : '1y';
      try { const h = await api('/historik', { symbol: sym, range }); if (h && Array.isArray(h.priser)) state.hist[sym] = { hamtad: new Date().toISOString(), valuta: h.valuta || null, priser: h.priser }; }
      catch (e) { state.hist[sym] = state.hist[sym] || { hamtad: new Date().toISOString(), priser: [] }; }
    }

}
function indexUtfall(e, dagarN) {
  if (!e.sym) return null;
  const ix = indexFor(e.sym), h = state.hist[ix];
  if (!h || !Array.isArray(h.priser) || !h.priser.length) return null;
  const start = histPriceAt(ix, e.d);
  const slutDatum = dagarN === 'nu' ? todayISO() : addDays(e.d, dagarN);
  if (slutDatum > todayISO()) return null;
  let slut = null;
  if (dagarN === 'nu') slut = h.priser[h.priser.length - 1][1]; else slut = histPriceAt(ix, slutDatum);
  return isNum(start) && isNum(slut) && start > 0 ? slut / start - 1 : null;

/* ---------- Etapp 5: backtest av kurs- och trendbaserade kriterier ---------- */
const BT_KEY = 'aktiekompassen-backtest';

const OMXS30 = ['ABB.ST', 'ALFA.ST', 'ASSA-B.ST', 'ATCO-A.ST', 'ATCO-B.ST', 'AZN.ST', 'BOL.ST', 'ELUX-B.ST', 'ERIC-B.ST', 'ESSITY-B.ST', 'EVO.ST', 'GETI-B.ST', 'HEXA-B.ST', 'HM-B.ST', 'INVE-B.ST', 'KINV-B.ST', 'NDA-SE.ST', 'NIBE-B.ST', 'SAAB-B.ST', 'SAND.ST', 'SCA-B.ST', 'SEB-A.ST', 'SHB-A.ST', 'SINCH.ST', 'SKF-B.ST', 'SWED-A.ST', 'TEL2-B.ST', 'TELIA.ST', 'VOLV-B.ST'];
const BT_STILAR = [
  { id: 'momentum', namn: 'Momentum', beskr: 'trenddimensionen (vikt 2) + P/E mot egen historik (0,5)', vM: 2, vV: 0.5 },
  { id: 'varde', namn: 'Värde (light)', beskr: 'P/E mot egen historik (vikt 2) + trend (0,5)', vM: 0.5, vV: 2 },
  { id: 'balanserad', namn: 'Balanserad (light)', beskr: 'trend och P/E mot egen historik lika', vM: 1, vV: 1 },
];
let btState = { running: false, done: 0, total: 0, fel: [] };
function btLoad() { try { const r = JSON.parse(localStorage.getItem(BT_KEY) || 'null'); return r && r.resultat ? r : null; } catch (e) { return null; } }
// Poäng för trend- och värderingskriterier vid index i (dagliga stängningskurser c, index ix) – samma kriterier och gränser som modellen.
function btTrendPoang(c, i, ixC, ixMap) {
  const kurs = c[i];
  const sma = (n) => { if (i + 1 < n) return null; let s = 0; for (let k = i - n + 1; k <= i; k++) s += c[k]; return s / n; };
  const ma50 = sma(50), ma200 = sma(200);
  let ma200fg = null; if (i - 40 + 1 >= 200) { let s = 0; for (let k = i - 40 - 200 + 1; k <= i - 40; k++) s += c[k]; ma200fg = s / 200; }
  let hi = -Infinity, lo = Infinity; for (let k = Math.max(0, i - 251); k <= i; k++) { if (c[k] > hi) hi = c[k]; if (c[k] < lo) lo = c[k]; }
  const ret = n => i - n >= 0 && c[i - n] > 0 ? (kurs / c[i - n] - 1) * 100 : null;
  let rsi = null; if (i >= 14) { let g = 0, l = 0; for (let k = i - 13; k <= i; k++) { const d = c[k] - c[k - 1]; if (d > 0) g += d; else l -= d; } rsi = g + l === 0 ? 50 : l === 0 ? 100 : 100 - 100 / (1 + (g / 14) / (l / 14)); }
  const ixRet = n => { if (!ixC) return null; const j = ixMap[i], j0 = ixMap[i - n]; return j != null && j0 != null && ixC[j0] > 0 ? (ixC[j] / ixC[j0] - 1) * 100 : null; };
  const r3 = ret(63), r12 = ret(252), i3 = ixRet(63), i12 = ixRet(252);
  const vals = {
    m_ma200: ma200 ? (kurs / ma200 - 1) * 100 : null, m_ma50: ma50 ? (kurs / ma50 - 1) * 100 : null, m_ma200dir: ma200 && ma200fg ? (ma200 / ma200fg - 1) * 100 : null,
    m_cross: ma50 && ma200 ? (ma50 / ma200 - 1) * 100 : null, m_52h: isFinite(hi) ? (kurs / hi - 1) * 100 : null, m_52l: isFinite(lo) && lo > 0 ? (kurs / lo - 1) * 100 : null,
    m_rs3: r3 != null && i3 != null ? r3 - i3 : null, m_rs12: r12 != null && i12 != null ? r12 - i12 : null, m_rsi: rsi,
  };
  let sum = 0, w = 0, n = 0;
  Object.keys(vals).forEach(id => { const k = KRIT_BY_ID[id]; const p = kritPoang(k, vals[id]); if (p != null) { sum += p * k.vikt; w += k.vikt; n++; } });

}
function btVardePoang(c, dates, i, vpa) {

  const epsAt = (d) => { let e = null; for (let k = vpa.length - 1; k >= 0; k--) { if (addDays(vpa[k].d, 90) <= d) { e = vpa[k].v; break; } } return e; };
  const e = epsAt(dates[i]); if (!(e > 0)) return null;
  const pe = c[i] / e;
  const hist = [];

/* ---------- Formulär (dialog) ---------- */
let sheetSubmit = null;
function openSheet(title, body, submitLabel, onSubmit, opts) {
  opts = opts || {};
  sheet.innerHTML = '<form id="sheetForm" novalidate><div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="btn icon" data-close aria-label="Stäng">✕</button></div>' +
    '<div class="sheet-body">' + body + '<p class="form-error" id="form-error" hidden></p><div class="sheet-actions"><button type="button" class="btn" data-close>' + esc(opts.cancelLabel || (submitLabel ? 'Avbryt' : 'Stäng')) + '</button>' +
    (submitLabel ? '<button type="submit" class="btn ' + (opts.danger ? 'danger' : 'primary') + '">' + esc(submitLabel) + '</button>' : '') + '</div></div></form>';
  sheetSubmit = onSubmit;
  if (!sheet.open) sheet.showModal();
  const first = sheet.querySelector('input:not([type=radio]):not([type=checkbox]), select, textarea');
  if (first && opts.focus !== false) first.focus();
}
sheet.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === sheet) sheet.close(); });
sheet.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;
  const err = sheetSubmit ? sheetSubmit(new FormData(form), form) : null;
  if (err) { const p = $('#form-error', form); p.textContent = err; p.hidden = false; return; }
  sheet.close();
});
function field(id, label, inputHtml) { return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' + inputHtml + '</div>'; }
function seg(name, options, current) {
  return '<div class="seg">' + options.map(o => '<label><input type="radio" name="' + name + '" value="' + esc(o[0]) + '"' + (String(o[0]) === String(current) ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>').join('') + '</div>';
}

// Sök bolag → välj → kurs och nyckeltal hämtas → fyll i antal och GAV.
function searchForm() {
  openSheet('Lägg till aktie',
    field('f-sok', 'Sök bolag eller kortnamn', '<input id="f-sok" name="q" type="search" placeholder="t.ex. Investor, VOLV-B, Evolution" autocomplete="off" autocapitalize="off">') +
    '<div id="sok-res" class="sok-res"><p class="hint">Skriv minst två tecken. Stockholmsbörsen visas först.</p></div>' +
    '<p class="hint"><button type="button" class="btn link" data-action="manual-add">Lägg till utan automatisk hämtning</button></p>',
    null, null);
  const input = $('#f-sok'), box = $('#sok-res');
  let timer = null, seq = 0;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) { box.innerHTML = '<p class="hint">Skriv minst två tecken. Stockholmsbörsen visas först.</p>'; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      box.innerHTML = '<p class="hint"><span class="spinner"></span> Söker…</p>';
      try {
        const hits = await api('/sok', { q });
        if (my !== seq) return;
        box.innerHTML = hits.length ? hits.map(h => '<button type="button" class="btn sok-hit" data-symbol="' + esc(h.symbol) + '" data-namn="' + esc(h.namn) + '"><span class="sh-sym">' + esc(h.symbol.replace(/\.[A-Z]+$/, '')) + '</span><span class="sh-name">' + esc(h.namn) + '</span><span class="sh-bors">' + esc(h.bors) + (h.typ === 'ETF' ? ' · ETF' : '') + '</span></button>').join('')
          : '<p class="hint">Inget bolag hittades. Prova bolagsnamnet eller kortnamnet från din mäklare.</p>';
      } catch (e) { if (my === seq) box.innerHTML = '<p class="form-error">Sökningen misslyckades: ' + esc(e.message) + '</p>'; }
    }, 350);
  });
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-symbol]');
    if (!b) return;
    const symbol = b.dataset.symbol, namn = b.dataset.namn;
    if (state.stocks.some(s => s.symbol === symbol)) { toast(symbol + ' finns redan i listan'); return; }
    box.querySelectorAll('button').forEach(x => { x.disabled = true; });
    box.insertAdjacentHTML('afterbegin', '<p class="hint"><span class="spinner"></span> Hämtar ' + esc(namn) + '…</p>');
    try { const q = await api('/aktie', { symbol }); stockForm(null, q); }
    catch (err) { box.querySelector('p').outerHTML = '<p class="form-error">Kunde inte hämta ' + esc(namn) + ': ' + esc(err.message) + '</p>'; box.querySelectorAll('button').forEach(x => { x.disabled = false; }); }
  });
  sheet.querySelector('[data-action=manual-add]').addEventListener('click', () => stockForm(null, null));
}

function stockForm(stock, q) {
  const s = stock || { ticker: q ? q.symbol.replace(/\.[A-Z]+$/, '') : '', symbol: q ? q.symbol : '', namn: q ? q.namn : '', lista: '', antal: 0, gav: null, kurs: q ? q.kurs : null, kursDatum: todayISO() };
  const autoNow = !!(q || (stock && stock.symbol));
  openSheet(stock ? 'Redigera aktie' : 'Lägg till aktie',
    (q ? '<div class="notice"><span>' + esc(q.namn) + ' · ' + (isNum(q.kurs) ? fmt(q.kurs, 2) + ' ' + esc(q.valuta || 'kr') : 'kurs saknas') + '. Kurs och nyckeltal hämtas automatiskt.</span></div>' : '') +
    '<div class="row2">' +
      field('f-ticker', 'Kortnamn (visas i listan)', '<input id="f-ticker" name="ticker" value="' + esc(s.ticker) + '" placeholder="t.ex. INVE-B" autocapitalize="characters" autocomplete="off">') +
      field('f-lista', 'Lista (valfritt)', '<select id="f-lista" name="lista">' + LISTOR.map(l => '<option value="' + esc(l) + '"' + (l === s.lista ? ' selected' : '') + '>' + (l || '–') + '</option>').join('') + '</select>') +
    '</div>' +
    field('f-namn', 'Bolag', '<input id="f-namn" name="namn" value="' + esc(s.namn) + '" placeholder="t.ex. Investor B" autocomplete="off">') +
    '<div class="row2">' +
      field('f-antal', 'Antal aktier', '<input id="f-antal" name="antal" class="num" inputmode="numeric" value="' + inputVal(s.antal, 0) + '" placeholder="0 = bara bevaka">') +
      field('f-gav', 'GAV (snittpris per aktie)', '<input id="f-gav" name="gav" class="num" inputmode="decimal" value="' + inputVal(s.gav, 2) + '" placeholder="från din mäklare">') +
    '</div>' +
    (autoNow ? '' : '<div class="row2">' +
      field('f-kurs', 'Kurs', '<input id="f-kurs" name="kurs" class="num" inputmode="decimal" value="' + inputVal(s.kurs, 2) + '">') +
      field('f-datum', 'Kursdatum', '<input id="f-datum" name="kursDatum" type="date" value="' + esc(s.kursDatum || todayISO()) + '">') +
    '</div>') +
    (stock ? field('f-symbol', 'Automatisk hämtning (Yahoo-symbol)', '<input id="f-symbol" name="symbol" value="' + esc(stock.symbol) + '" placeholder="t.ex. INVE-B.ST – tomt = manuell" autocapitalize="characters" autocomplete="off">') : ''),
    stock ? 'Spara' : 'Lägg till', fd => {
      const ticker = String(fd.get('ticker') || '').trim().toUpperCase(), namn = String(fd.get('namn') || '').trim();
      if (!ticker) return 'Ange ett kortnamn.';
      if (!namn) return 'Ange bolagets namn.';
      const antal = parseNum(fd.get('antal')) == null ? 0 : parseNum(fd.get('antal'));
      if (antal < 0) return 'Antal kan inte vara negativt.';
      const gav = parseNum(fd.get('gav'));
      if (stock) {
        const cur = stockById(stock.id);
        if (!cur) return 'Aktien finns inte längre.';
        const symbol = String(fd.get('symbol') || '').trim().toUpperCase();
        const symbolChanged = symbol !== cur.symbol;
        Object.assign(cur, { ticker, namn, lista: String(fd.get('lista') || ''), antal, gav, symbol });
        if (!autoNow || symbolChanged) { if (fd.get('kurs') != null) { const k = parseNum(fd.get('kurs')); if (k != null) cur.kurs = k; } if (fd.get('kursDatum')) cur.kursDatum = String(fd.get('kursDatum')); }
        if (symbolChanged) { cur.hamtad = null; cur.fel = null; cur.varning = null; if (!symbol) { cur.forandring = null; } }
        commitStock(cur);
        if (symbolChanged && symbol) refreshStock(cur.id).catch(() => {});
      } else {
        let id = slug(ticker);
        if (stockById(id)) { if (q) id = slug(q.symbol); if (stockById(id)) return ticker + ' finns redan.'; }
        const ns = normalizeStock({ id, ticker, namn, lista: fd.get('lista'), antal, gav, symbol: s.symbol, kurs: q ? null : parseNum(fd.get('kurs')), kursDatum: q ? null : (String(fd.get('kursDatum') || '') || todayISO()) }, id);
        if (q) applyQuote(ns, q);
        state.stocks.push(ns);
        if (antal > 0 && gav > 0) ns.transaktioner.push({ datum: todayISO(), typ: 'kop', antal, pris: gav, courtage: 0, resultat: null });
        commitStock(ns);
        state.stockId = id; state.view = 'portfolj'; render(); window.scrollTo(0, 0);
        if (ns.symbol) refreshStock(ns.id).catch(() => {});
        // Ägd aktie: be om tes och säljplan direkt.
        if (antal > 0) setTimeout(() => tesSheet(ns.id, true), 350);
      }
      toast('Sparat'); return null;
    });
}

      if (rule) { const cur = list.find(x => x.id === rule.id); if (!cur) return 'Regeln finns inte längre.'; Object.assign(cur, data); }

      else { state.settings.rules = state.settings.rules.filter(x => x.id !== rule.id); commitSettings(); }
